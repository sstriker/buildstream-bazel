# Build-lens config for nlohmann-json — sourced by run-survey.sh.
# nlohmann-json is a header-only JSON library. JSON_BuildTests gates
# `add_subdirectory(tests)` (CMakeLists 150-153); the tests #include a generated
# `test_data.hpp` (a large downloaded/baked test-data blob) that isn't a library
# input — "test_data.hpp: No such file or directory". Scope the tests off (the
# "build the library, not its test tree" rule the other members apply); the
# header-only target then builds clean.
_NJ_FLAGS='--cmake-define JSON_BuildTests=OFF'
DIAG_CONVERT_FLAGS="$_NJ_FLAGS"
CONVERT_FLAGS="$_NJ_FLAGS"
