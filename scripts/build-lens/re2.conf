# Build-lens config for re2 (google/re2) — sourced by run-survey.sh.
#
# re2's only build-time find_package is abseil: `find_package(absl REQUIRED)`
# (CMakeLists 84). Tests/benchmarks (which pull GTest/benchmark/PCRE) are OFF by
# default (RE2_BUILD_TESTING OFF), so the library itself needs only absl. Without
# absl installed, cmake configure hard-fails — which is why a bare survey reports
# re2 as CONVERT FAILED. Provision absl the same way grpc/buildbox do:
#   sh tools/install-survey-deps.sh        # abseil -> /tmp/absl-install (default-on)
# then CMAKE_PREFIX_PATH points find_package there and re2-imports.json maps every
# absl::* imported target onto its @abseil-cpp BCR label (reuses the abseil element
# from grpc-imports.json), so the converter emits hermetic deps instead of HOST
# cc_imports of the installed .a files.
_RE2_FLAGS="--cmake-define RE2_BUILD_TESTING=OFF \
--cmake-define CMAKE_PREFIX_PATH=/tmp/absl-install;/usr \
--imports-manifest=$repo_root/scripts/build-lens/re2-imports.json"
DIAG_CONVERT_FLAGS="$_RE2_FLAGS"
CONVERT_FLAGS="$_RE2_FLAGS"
EXTRA_BAZEL_DEPS='bazel_dep(name = "abseil-cpp", version = "20240722.0.bcr.2")'
# STATUS: the CONVERTIBILITY lenses are GREEN with this conf — with abseil host-
# installed (install-survey-deps.sh) + CMAKE_PREFIX_PATH, re2's cmake configure
# resolves and the converter emits 0 rejections (up from a bare CONVERT FAILED).
# The BUILD lens is a FOLLOW-ON (grpc.conf-class work): re2-imports.json's absl
# umbrella target list is generated against one abseil version, but Bazel MVS
# resolves the shared graph to a newer abseil (a peer dep pulls it), whose target
# set differs (e.g. absl/strings:resize_and_overwrite present in one, absent in
# the other) — so the umbrella deps must be REGENERATED against the version that
# actually resolves. On the sandbox that's further constrained by the GitHub->GCS
# mirror only carrying some abseil release archives (the newest 20260107.1 404s;
# 20240722.0 / 20250814.1 are present). Until the manifest is regenerated against
# the resolvable version, re2's build lens self-reports FAIL (convert stays green).

# Reuse the absl umbrella (abseil's whole header tree lands on re2's compile line
# via find_package(absl); strict per-target headers reject the ones re2 never
# declared — the umbrella re-exports abseil's full public surface and lower wires
# it wherever the find_package include dir would drop). Same helper as grpc.conf.
extra_ws_setup() {
    _ws="$1"
    mkdir -p "$_ws/absl_umbrella"
    {
        echo 'load("@rules_cc//cc:defs.bzl", "cc_library")'
        echo ''
        echo 'cc_library('
        echo '    name = "absl",'
        echo '    visibility = ["//visibility:public"],'
        echo '    deps = ['
        python3 -c "
import json
for el in json.load(open('$repo_root/scripts/build-lens/re2-imports.json'))['elements']:
    for l in el.get('umbrella_deps', []):
        print('        \"%s\",' % l)
"
        echo '    ],'
        echo ')'
    } > "$_ws/absl_umbrella/BUILD.bazel"
}
