# Build-lens config for bde (Bloomberg BDE) — sourced by run-survey.sh.
#
# BDE is a metadata-driven C++ library collection: each package GROUP is built
# by a single bbs_setup_target_uor(${target}) call that reads the group's
# *.mem (component membership) + *.dep (inter-group dependency) metadata to
# enumerate sources/components, instead of explicit add_library(...) /
# target_sources(...). The hierarchy is groups -> packages -> components, each
# component a .h + .cpp + .t.cpp *test-driver* triple, so a group expands to
# thousands of tiny translation units + one test executable per component.
#
# WHAT IT EXERCISES the rest of the corpus doesn't:
#   1. SCALE in the llvm/vtk tier from a TINY CMakeLists — groups/bsl alone is
#      ~18 archives + ~1,100 per-component .t.cpp test-driver executables, all
#      enumerated from .mem/.dep metadata the File-API codemodel has already
#      resolved (so the metadata-driven novelty is largely invisible to the
#      converter — the genuine new stress is the target COUNT).
#   2. A python3 test-runner add_test shape: BBS registers each driver as
#      add_test(NAME ... COMMAND python3 <bbs runner> <driver-exe>), not the
#      bare executable, so the cc_test lowering can't claim them (a "dropped
#      test trees" datapoint, tracked in ROADMAP.md). The driver EXECUTABLES
#      still emit as cc_binary.
#   3. sim_cpp11_features.pl perl codegen — BBS generates *_cpp03 component
#      variants via a perl add_custom_command (a genrule-recovery surface).
#   4. bbs_emit_pkg_config -> generated .pc files (the pkg-config harvester).
#
# PROVISIONING: the top-level find_package(BdeBuildSystem REQUIRED) is provided
# by the bde-tools checkout (same tag), so CMAKE_PREFIX_PATH points cmake at it
# (`make fetch-bde` clones BOTH bde + bde-tools; the SessionStart hook fetches
# them on web sessions). BBS's bbs_emit_pkg_config hard-requires
# CMAKE_INSTALL_LIBDIR, so we set it.
#
# SCOPE: ONE package group, groups/bsl (the foundation group), per ROADMAP.md
# ("start at ONE package group, not the full tree" — bounds the cost). The
# survey runs at the BDE *root* (find_package(BdeBuildSystem) + project() live
# there, so groups/bsl/CMakeLists.txt can't configure standalone), with the
# other groups (bdl/bal/bbl), the standalones/ tree, and the bsl-irrelevant
# thirdparty deps (inteldfp/pcre2 — used only by bdl) pruned at configure time
# via CONFIGURE_PRUNE_SUBDIRS. bsl's one thirdparty dep (bbryu) is kept.
_BDE_FLAGS="--cmake-define CMAKE_PREFIX_PATH=/tmp/bde-tools \
--cmake-define CMAKE_INSTALL_LIBDIR=lib"
DIAG_CONVERT_FLAGS="$_BDE_FLAGS"
CONVERT_FLAGS="$_BDE_FLAGS"

# STATUS (groups/bsl, --split-packages, BDE/bde-tools 4.38.0.0): the convert
# emits 21 package BUILDs — 53 cc_library (the 18 group/package archives + the
# split header libs) + 729 cc_binary per-component test-driver executables.
# Structural lenses: rejections 1, idiom 0, coverage 7, todos 2.
#   - The 1 rejection is unsupported-execute-process (9 calls): BBS runs
#     bde_xt_cpp_splitter.py / sim_cpp11_features.pl as a configure-time
#     execute_process to split large .xt.cpp drivers + generate _cpp03 variants
#     — a side-effect file generator with no captured output channel, so it's
#     not liftable as a configure value (a codegen-recovery datapoint, not 0/0/0
#     like buildbox's structural pass). The build lens therefore self-skips
#     (skip(rej)) until that codegen is recovered as a genrule.
#   - The 729 driver registrations are add_test(COMMAND python3 <bbs runner>
#     <driver>), so they DON'T lower to cc_test (the drivers still emit as
#     cc_binary) — a "dropped test trees" datapoint tracked in ROADMAP.md.
#   - The 7 dropped-link-dep coverage findings are the bsl+bslhdrs umbrella
#     interface lib's edges to its 7 sibling package interface libs (the
#     abseil-INTERFACE-deps class) — a real coverage gap to chase, also in
#     ROADMAP.md.
# See docs/survey-corpus.md (corpus roster) for the full writeup.

# Prune everything but groups/bsl (+ its bbryu thirdparty dep). Each pair is
# "<rel-cmakelists>:<add_subdirectory-arg>"; run-survey comments the matching
# add_subdirectory() line out in a throwaway copy (the clone is never touched).
CONFIGURE_PRUNE_SUBDIRS="groups/CMakeLists.txt:bdl \
groups/CMakeLists.txt:bal \
groups/CMakeLists.txt:bbl \
CMakeLists.txt:standalones \
thirdparty/CMakeLists.txt:\"inteldfp/LIBRARY\" \
thirdparty/CMakeLists.txt:pcre2"
