# Build-lens config for glog — sourced by run-survey.sh's try_bazel_build.
# Schema + how each var is applied: see scripts/run-survey.sh. Rationale for
# this project's knobs: docs/survey-corpus.md "Build-lens status".
#
# glog's unit tests reference glog's internal (GLOG_NO_EXPORT /
# -fvisibility=hidden) symbols (GetExistingTempDirectories, g_logging_fail_func,
# SafeFNMatch_, ...). Bazel's default dynamic linking builds glog as a .so that
# doesn't export those hidden symbols, so the cc_tests fail to link;
# --dynamic_mode=off links them statically (the way glog's own static build
# links its tests, matching the converter's linkstatic=True output), resolving
# the symbols.
BAZEL_FLAGS='--dynamic_mode=off'
