# Build-lens config for eigen — sourced by scripts/run-survey.sh's build lens.
#
# eigen is HEADER-ONLY and uses no find_package, so the header library itself
# converts cleanly. Several parts of its tree are NOT the library and are
# disabled here so the lens exercises just the header library:
#   - EIGEN_BUILD_BLAS / EIGEN_BUILD_LAPACK: eigen bundles a Fortran reference
#     BLAS/LAPACK. Fortran has no Bazel ruleset wired into the converter's
#     output (genuinely unsupported — deferred), so building these would fail.
#   - EIGEN_BUILD_TESTING: eigen's test suite is a ~900-target -Werror SIMD dev
#     surface — a separate concern from "does the library build".
#   - EIGEN_BUILD_DOC: defaults ON at top level (when doxygen is present), and
#     pulls in the doc/examples + doc/snippets + unsupported/doc/examples
#     programs — documentation cc_binary demos that #include <Eigen/Dense> etc.
#     They're a documentation dev surface, not the library, and fail to resolve
#     the header include in the converted shape; off for the library build.
#   - EIGEN_BUILD_DEMOS: the demos/ programs — likewise dev surface, not lib.
# With these OFF, eigen converts to its header library (single cc_library) that
# builds green.
CONVERT_FLAGS='--cmake-define EIGEN_BUILD_TESTING=OFF --cmake-define EIGEN_BUILD_BLAS=OFF --cmake-define EIGEN_BUILD_LAPACK=OFF --cmake-define EIGEN_BUILD_DOC=OFF --cmake-define EIGEN_BUILD_DEMOS=OFF'
