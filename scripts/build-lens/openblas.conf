# Build-lens config for OpenBLAS — sourced by run-survey.sh's try_bazel_build.
# Schema + how each var is applied: see scripts/run-survey.sh. Survey notes +
# the getarch verdict: docs/survey-corpus.md (OpenBLAS rows).
#
# STATUS: with this .conf + the run-survey.sh DIAG_CONVERT_FLAGS hook + the
# split-package converter fixes, OpenBLAS surveys 0/0/0 and the ~2460-target
# C-LAPACK graph builds. Getting the C compile + link green took four converter
# features + two build-lens flags, each peeling the next blocker (full detail in
# docs/survey-corpus.md, OpenBLAS rows):
#   1. GenerateNamedObjects absolute #includes — lower's
#      stageGeneratedSourceRootIncludes rewrites the ~1951 baked
#      `#include "<srcroot>/...kernel.c"` to workspace-relative + stages the
#      kernel (.c/.S) as a textual_hdr on the compiling target.
#   2. Transitive micro-kernel closure — a staged kernel #includes sibling
#      micro-kernels (caxpy.c -> caxpy_microk_haswell-2.c); textualIncludeClosure
#      stages the whole chain.
#   3. config.h — written via file(RENAME) in the cross-compile branch (not
#      configure_file); shadow.classifyFileRename recovers it as COPYONLY so it
#      bakes + folds into root_headers.
#   4. (flag) NO_CBLAS=1 — drops the CBLAS reference test suite (ctest/), whose
#      programs collide with the library on cblas_xerbla under alwayslink.
# A faithful converter follow-up for #4 is tracked in docs/survey-corpus.md.
# The former CMAKE_C_FLAGS=-mfma build-lens flag is gone: lower's compile-group
# split now carries each per-source `COMPILE_OPTIONS "-mfma"` FMA kernel
# (*rot_k*, dgemv_t_k) in its own per-flag sub-cc_library, so those sources get
# -mfma from their own compile group without forcing it build-wide.
#
# OpenBLAS is big (~2460 targets): assembly (.S, cc-compilable) kernels +
# Fortran/LAPACK + arch-conditional source selection. The build-lens convert
# uses:
#   - NOFORTRAN=1 C_LAPACK=1 — the C-only reference-LAPACK path. OpenBLAS has
#     no Bazel-modelable Fortran rule (rules_fortran isn't in the BCR), so the
#     Fortran reference LAPACK would emit unbuildable cc_* targets; C_LAPACK
#     swaps in the C translation and the 51 `fortran-target-needs-ruleset`
#     idioms drop to 0.
#   - CMAKE_SYSTEM_NAME=Linux + CORE/TARGET/TARGET_CORE=HASWELL — forces
#     OpenBLAS's deterministic-arch (cross-compile) configure branch
#     (cmake/prebuild.cmake:98). That branch writes the arch config (#define
#     CORE_HASWELL, cache sizes, HAVE_AVX2, GEMM unroll factors, ...) from a
#     STATIC per-core table instead of running the `getarch`/`getarch_2nd`
#     host-CPU probes. Those probes are 4 execute_process(OUTPUT_VARIABLE ...)
#     calls whose captured stdout drives arch-conditional source selection
#     across the whole library — a configure-time host-program oracle that is
#     genuinely not Bazel-modelable (no OUTPUT_FILE redirect / dump-vars
#     capture to lift; the value mutates the build graph). Pinning the core
#     makes the source selection deterministic and static, which is what a
#     Bazel graph needs. HASWELL = a mainstream x86_64 core with a complete
#     table entry in prebuild.cmake.
#   - BUILD_TESTING=OFF / BUILD_BENCHMARKS=OFF — trim the test/benchmark
#     surface so the lens measures the library, not the cc_test/benchmark
#     binaries (and avoids OpenBLAS's utest include-dir shape).
#
# Two knobs carry the SAME deterministic-arch + C-LAPACK flag set, because the
# build-lens has two convert passes that both need OpenBLAS in this configure:
#   - DIAG_CONVERT_FLAGS — applied to the *diagnostics* convert that drives the
#     skip(rej) gate (run-survey.sh, top of the per-project loop). Flag-less,
#     OpenBLAS's native configure runs the getarch host-CPU probes and surfaces
#     the `unsupported-execute-process` rejection, so the gate would skip(rej)
#     and never build. These flags select the probe-free deterministic-arch
#     branch so the gate sees 0 rejections.
#   - CONVERT_FLAGS — applied to the build-lens convert inside try_bazel_build
#     (the one that actually emits the tree `bazel build //...` consumes).
# (CONVERT_FLAGS are sourced only inside try_bazel_build, AFTER the gate, so on
# their own they can't lift a gate rejection — hence the separate DIAG knob.)
# NO_CBLAS=1: OpenBLAS's CBLAS reference test suite (ctest/, the x?cblat?
# programs) is gated by NO_CBLAS/ONLY_CBLAS — NOT BUILD_TESTING (which only
# gates lapack-netlib/TESTING), and NOFORTRAN=1 already drops the Fortran
# test/. Those test programs compile their own ctest/c_xerbla.c (cblas_xerbla)
# AND link the library, whose cblas_xerbla is force-included because the
# converter inlines cmake OBJECT libraries as alwayslink=True cc_library deps
# (a real .a archive wouldn't pull the overridden object) — so the link fails
# `duplicate symbol: cblas_xerbla`. The library itself compiles green; this is
# purely the reference-test surface (the same "build the library, not its test
# tree" scoping eigen/cutlass apply via EIGEN_BUILD_TESTING / CUTLASS_ENABLE_*).
# NO_CBLAS drops the C-interface veneer + its tests while keeping the core
# kernels + LAPACK + the standard BLAS interface. (Faithful follow-up: don't
# force a test target's own symbols in via an alwayslink dep — converter work.)
#
# Per-source FMA kernels: OpenBLAS tags individual FMA kernels (*rot_k*,
# dgemv_t_k) with `set_source_files_properties(... COMPILE_OPTIONS "-mfma")`
# (cmake/utils.cmake, gated on HAVE_FMA3). cmake's codemodel files those
# sources in their own compile group (distinct CompileCommandFragments), and
# lower's split now emits each compile group as its own per-flag sub-cc_library
# — so the FMA kernels compile WITH -mfma and the bulk of the library WITHOUT
# it, matching cmake exactly. No build-wide -mfma flag needed (it previously
# masked the gap; the converter expresses it faithfully now).
_OB_FLAGS='--cmake-define NOFORTRAN=1 --cmake-define C_LAPACK=1 --cmake-define CMAKE_SYSTEM_NAME=Linux --cmake-define CMAKE_SYSTEM_PROCESSOR=x86_64 --cmake-define CORE=HASWELL --cmake-define TARGET=HASWELL --cmake-define TARGET_CORE=HASWELL --cmake-define BUILD_TESTING=OFF --cmake-define BUILD_BENCHMARKS=OFF --cmake-define NO_CBLAS=1'
DIAG_CONVERT_FLAGS="$_OB_FLAGS"
CONVERT_FLAGS="$_OB_FLAGS"
