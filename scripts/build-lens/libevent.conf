# Build-lens config for libevent — sourced by run-survey.sh.
# EVENT__DISABLE_TESTS=ON scopes out libevent's regress test tree (CMakeLists
# 873/1075). Two reasons: (1) the regress tests generate `test/regress.gen.c`
# OUTSIDE the build dir (a custom-command-script rejection); (2) with the tests
# IN, the --diagnostics convert hangs (a converter loop on the regress target
# graph — tracked in ROADMAP). Tests off, both the diagnostic and build-lens
# converts complete clean (0 rejections) and the libevent libraries build.
_LE_FLAGS='--cmake-define CMAKE_POLICY_VERSION_MINIMUM=3.5'
DIAG_CONVERT_FLAGS="$_LE_FLAGS"
CONVERT_FLAGS="$_LE_FLAGS"
