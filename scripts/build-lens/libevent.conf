# Build-lens config for libevent — sourced by run-survey.sh.
#
# libevent now surveys and BUILDS fully tests-ON (the regress test tree in).
# Getting here took a chain of fixes, all shipped: the --diagnostics convert
# hang (anchorGenruleOutputsToRuledir absolute-output walk), in-source
# generation of test/regress.gen.{c,h} (buildInSourceWorkdirGenrule, mono +
# split), staging the generated sibling header onto its consumers
# (stageSiblingGeneratedHeaders), and finally the include-path layer: the
# generated header is bare-`#include`d same-dir by committed sources
# (test/regress.c / regress_rpc.c), which cmake resolved via source-tree
# co-location but Bazel can't (the genrule output lands in genfiles). The
# sibling-header post-pass now also puts the header's dir on the consumer's
# `includes`, so under --split-packages the synthesized `test_headers` lib
# (includes=["."]) propagates the genfiles -I and the bare include resolves.
#
# Result: EVENT__DISABLE_TESTS is no longer forced — libevent surveys 0-rej and
# `bazel build //...` is green with all the regress cc_tests built. No special
# convert flags are needed; this conf stays as the documented anchor.
