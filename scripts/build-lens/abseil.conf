# Build-lens config for abseil — sourced by run-survey.sh's try_bazel_build.
# Schema + how each var is applied: see scripts/run-survey.sh. Campaign memory
# + the full diagnosis of the two residuals: docs/corpus-green-campaign.md
# (abseil row).
#
# abseil's library surface (638 of 639 targets) builds clean with the converter
# defaults — testing is OFF (cmake's BUILD_TESTING is on but ABSL_BUILD_TESTING
# defaults off), so no cc_test is emitted. The lone holdout is
# `absl_heterogeneous_lookup_testing`, a header-only INTERFACE library abseil
# declares WITHOUT the TESTONLY keyword (so it is always emitted) whose
# target_link_libraries names two deps that DON'T exist in a testing-off build:
#
#   1. GTest::gmock — a find_package(GTest) IMPORTED target. abseil's default
#      (ABSL_FIND_GOOGLETEST=ON) resolves googletest via find_package, i.e. an
#      EXTERNAL dep, so it is imports-routable (NOT a FetchContent/in-graph
#      dep). The imports manifest below maps it (and its siblings) to the BCR
#      googletest module's labels — gmock is fused into @googletest//:gtest in
#      that module, so GTest::gmock / GTest::gtest both route to //:gtest and the
#      *_main variants to //:gtest_main. Routing the trace-synth INTERFACE
#      library's deps through the manifest is the converter's
#      lowerInterfaceLibraries imports step.
#   2. absl::test_instance_tracker — abseil's OWN internal TESTONLY helper lib.
#      Because it is TESTONLY and not PUBLIC, abseil's absl_cc_library macro
#      early-returns and never creates the target unless ABSL_BUILD_TESTING is
#      on (which would also emit every cc_test and explode the gmock surface).
#      So the codemodel never sees it and the only honest output is to drop the
#      dangling edge — pruneDanglingTraceInterfaceDeps does this for trace-synth
#      INTERFACE libs whose `:`-local dep names no emitted target. No knob needed
#      here for #2; it's handled in the converter.
#
# The googletest bazel_dep matches abseil's own MODULE.bazel pin (1.17.0).
#
# BAZEL_FLAGS: the BCR googletest module's BUILD.bazel still declares its
# cc_library/cc_test targets with the bare (built-in) rule names and no
# `load("@rules_cc//cc:defs.bzl", ...)`. Bazel 9 removed those built-ins from
# external repos, so loading @googletest's BUILD fails ("This rule has been
# removed from Bazel; add a load() statement") and `@googletest//:gtest` reads
# as undeclared. --incompatible_autoload_externally re-enables the autoload shim
# that provides cc_library/cc_test/cc_binary to external modules (main-repo
# autoloads stay disabled, so the converter's own emitted BUILD — which DOES
# carry explicit loads — is unaffected). This is purely a property of the
# upstream googletest module under bazel 9, not of the converted abseil output.
CONVERT_FLAGS="--imports-manifest=$repo_root/testdata/fidelity/abseil-imports.json"
EXTRA_BAZEL_DEPS='bazel_dep(name = "googletest", version = "1.17.0")'
BAZEL_FLAGS='--incompatible_autoload_externally=+cc_library,+cc_test,+cc_binary'
