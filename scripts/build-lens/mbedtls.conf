# Build-lens config for mbedtls — sourced by run-survey.sh.
# Scope to the library + programs, not the test suite. mbedtls's tests/ tree
# generates test_suite_*.c via python and links them against the built
# libmbedtls.a at a config-specific path (`library:Debug/libmbedtls.a`) — a test
# surface, not the crypto library. ENABLE_TESTING=OFF gates add_subdirectory(tests)
# (CMakeLists 408); the mbedcrypto/mbedx509/mbedtls libraries + the programs/
# CLI tools then build.
#
# Two generic converter fixes underpin mbedtls converting cleanly: srcs dedup
# (a generated build-dir source + a same-named committed source collapse to one
# package-relative label) and identity-copy drop (mbedtls's link_to_source(X)
# copies a file to itself — Bazel forbids in==out; the source already serves it).
_MBED_FLAGS='--cmake-define ENABLE_TESTING=OFF --cmake-define ENABLE_PROGRAMS=OFF'
DIAG_CONVERT_FLAGS="$_MBED_FLAGS"
CONVERT_FLAGS="$_MBED_FLAGS"
