# Survey/build-lens config for cryptoauthlib — sourced by scripts/run-survey.sh.
# Schema + how each var is applied: see scripts/run-survey.sh. Survey notes:
# docs/survey-corpus.md (cryptoauthlib row + caveat).
#
# cryptoauthlib earns its corpus place as the real-world RECURSIVE CMAKE via
# configure-time execute_process (the superbuild-at-configure idiom
# nested_cmake.go targets). Two non-defaults are needed to actually hit it:
#
#   1. The CMake root is the `lib/` subdir (project(cryptoauth C)), not the
#      repo root — survey `$(CRYPTOAUTHLIB_DIR)/lib` (pass that as the
#      name=<src> arg: `cryptoauthlib=$CRYPTOAUTHLIB_DIR/lib`).
#   2. The mbedtls integration is gated `option(ATCA_MBEDTLS … OFF)`. Turn it
#      ON so cmake/mbedtls.cmake runs its configure-time nested cmake build:
#      configure_file(third_party/CMakeLists-mbedtls.txt.in) →
#      execute_process(${CMAKE_COMMAND} -G … .) → execute_process(${CMAKE_COMMAND}
#      --build .) → file(GLOB) the materialized mbedtls sources.
#
# `make fetch-cryptoauthlib` pre-fetches the mbedtls tarball that nested build
# downloads and repoints the ExternalProject URL at a local file:// copy, so the
# configure-time nested build needs no network (URL_HASH still verifies).
#
# DIAG_CONVERT_FLAGS shapes the diagnostics convert (the three convertibility
# lenses); CONVERT_FLAGS shapes the build-lens convert. Same define for both.
DIAG_CONVERT_FLAGS='--cmake-define ATCA_MBEDTLS=ON'
CONVERT_FLAGS='--cmake-define ATCA_MBEDTLS=ON'
