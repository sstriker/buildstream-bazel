# Build-lens config for VTK — sourced by run-survey.sh.
# VTK is codegen-heavy: 702 of its 708 default rejections are the SAME custom
# command, `cmake -P CMake/vtkEncodeString.cmake` (vtk_encode_string turns a
# file — GLSL shaders, cell-grid basis data, … — into a C string in a
# generated .cxx), plus 3 `cmake -P CMake/vtkHashSource.cmake`. Both are
# deterministic file→source transforms, so --cmake-script-bake captures the
# generated bytes at convert time (the survey already runs cmake via the File
# API) and emits genrules that materialize them — no cmake at build time. Same
# mechanism libpng uses for gensrc.cmake.
#
# The other 3 default rejections are all `git describe` in
# VTKDetermineVersion.cmake (a non-hermetic version stamp, same class as SDL's
# git_describe). The function skips the git call when VTK_GIT_DESCRIBE is
# already set (`if (NOT VTK_GIT_DESCRIBE AND ...)`), so pin it to the release
# tag — drops the execute_process to 0 rejections.
#
# --cmake-script-trace augments a recovered `cmake -P` genrule's srcs with the
# files the script READS (traced at convert time). VTK's bundled libproj builds
# proj.db via `cmake -P generate_proj_db.cmake`, which `include(sql_filelist.cmake)`
# and reads the .sql data files; without tracing, the genrule stages only the
# script and fails "include could not find sql_filelist.cmake".
#
# proj.db (formerly the KNOWN BUILD BLOCKER, solved 2026-06): generate_proj_db.cmake
# pipes the concatenated .sql into VTK's OWN bundled sqlite3 binary
# (`set(EXE_SQLITE3 "$<TARGET_FILE:VTK::sqlitebin>")`; the find_program path is
# disabled behind `if (FALSE)`). The workdir-buildout lift (in-source
# WORKING_DIRECTORY + build-dir outputs) now reconstructs both trees in scratch
# dirs and the built-tool rewrite routes sqlitebin through `$(location …)` +
# genrule `tools`, so the genrule produces the real 7.2 MB SQLite db under
# `bazel build`. The full-graph sweep went green 2026-06-12.
_VTK_FLAGS='--cmake-script-bake=true --cmake-script-trace=true --cmake-define VTK_GIT_DESCRIBE=v9.4.2'
DIAG_CONVERT_FLAGS="$_VTK_FLAGS"
CONVERT_FLAGS="$_VTK_FLAGS"
