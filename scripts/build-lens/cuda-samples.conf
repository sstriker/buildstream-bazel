# Build-lens config for cuda-samples (NVIDIA CUDA sample suite) — sourced by
# run-survey.sh's build lens. Schema + how each var is applied: see
# scripts/run-survey.sh.
#
# STATUS: a surveyed sample builds GREEN. cpp/0_Introduction/vectorAdd converts
# 0-rej and `bazel build //...` completes (cuda_binary nvcc-compiled, deps the
# synthesized Common:Common_headers). The remaining work to green the WHOLE suite
# (the find_package(CUDAToolkit) library group + the 9_CUDA_Tile/tileiras
# whole-tree configure blocker) is enumerated at the bottom. Survey a sample:
#   SURVEY_BAZEL_BUILD=cuda-samples scripts/run-survey.sh \
#       cuda-samples=$CUDASAMPLES_DIR/cpp/0_Introduction/vectorAdd
#
# PREREQUISITES (provision once per session):
#   1. nvcc + gcc-12 + the self-contained CUDA root:
#        BSB_PROVISION_CUDA=1 (SessionStart hook) installs nvidia-cuda-toolkit +
#        gcc-12/g++-12; then `sh scripts/provision-cuda-root.sh` assembles the
#        monolithic root rules_cuda needs (Debian scatters CUDA; rules_cuda's
#        local-toolchain wants one tree) and prints its path. Export it:
#          export BSB_CUDA_ROOT=$(sh scripts/provision-cuda-root.sh)
#          export BSB_CUDA_HOST_CC=/usr/bin/gcc-12
#      See docs/survey-corpus.md "CUDA toolkit" + scripts/provision-cuda-root.sh.
#
# EXTRA_BAZEL_DEPS: rules_cuda (BCR) + its local CUDA toolchain pointed at the
# assembled root. Appended verbatim after the build lens's base bazel_deps, so
# the use_extension/use_repo block (which must follow all bazel_deps) lands in
# the right place. The ${BSB_CUDA_ROOT} expands at conf-source time.
EXTRA_BAZEL_DEPS="$(cat <<EOF
bazel_dep(name = "rules_cuda", version = "0.3.0")
cuda = use_extension("@rules_cuda//cuda:extensions.bzl", "toolchain")
cuda.toolkit(
    name = "cuda",
    toolkit_path = "${BSB_CUDA_ROOT:-/opt/cuda-root}",
)
use_repo(cuda, "cuda")
EOF
)"

# ELEMENT_SOURCE_ROOT — overlay the WHOLE cuda-samples repo into the element.
# Each sample's CMakeLists lives under cpp/<group>/<sample>/ but #includes shared
# headers from the repo-root Common/ (`include_directories(../../../Common)` →
# helper_cuda.h etc.) and pulls cmake/Modules/ from the repo root. A scoped
# survey of one sample/group leaves those siblings outside the source root, so
# the converted include can't resolve them (the same split-source case zstd hits
# with its lib/ sibling). cmake still configures at the surveyed dir ($_bb_src,
# a self-contained `project()` sample); this only redirects the OVERLAY to the
# repo root so Common/ + cmake/ are staged under elements/cuda-samples/. The
# repo root is the nearest ancestor of $_bb_src holding both Common/ and cpp/ —
# computed by walking up so it's independent of which sample/group is surveyed.
# Guard on ${_bb_src:-}: the conf is ALSO sourced by the diagnostic pass (only
# to read DIAG_CONVERT_FLAGS), where $_bb_src is unset — referencing it bare
# would trip the survey's `set -u` and abort the whole run.
_csr="${_bb_src:-}"
if [ -n "$_csr" ]; then
    while [ "$_csr" != "/" ] && { [ ! -d "$_csr/Common" ] || [ ! -d "$_csr/cpp" ]; }; do
        _csr="$(dirname "$_csr")"
    done
    [ -d "$_csr/Common" ] && ELEMENT_SOURCE_ROOT="$_csr"
fi

# CONVERT_FLAGS — NOTE: see remaining-work item 4. cuda-samples HARD-SETS
#   `set(CMAKE_CUDA_ARCHITECTURES 75 80 86 87 89 90 100 110 120)` in its
#   CMakeLists, which clobbers a `-DCMAKE_CUDA_ARCHITECTURES=...` cache override.
#   The converter now DROPS the resulting `--generate-code=arch=...` /  `-gencode`
#   flags from BOTH copts and linkopts (lower's isNvccArchFlag): rules_cuda
#   forbids per-target arch flags ("not allowed to be specified directly via
#   copts of rules_cuda related rules") because arch is a TOOLCHAIN concern set
#   via the `@rules_cuda//cuda:archs` build flag, not a rule attr. This also
#   sidesteps the Blackwell-arch problem entirely — CUDA 12.0's nvcc rejects the
#   force-set compute_100/110/120, but since those flags are dropped, the build
#   uses rules_cuda's toolchain-default arch. To target specific arches, set
#   `--@rules_cuda//cuda:archs=...` in BAZEL_FLAGS (not via copts).
#
# --imports-manifest: the find_package(CUDAToolkit) library group. The
#   4_CUDA_Libraries samples link cuBLAS/cuFFT/NPP/etc. via the CUDAToolkit
#   module's IMPORTED targets (CUDA::cublas, …); the manifest maps each onto
#   the rules_cuda local-toolkit repo's component label (@cuda//:cublas, … —
#   target names per rules_cuda's cuda/private/templates/registry.bzl), the
#   same imports-manifest path abseil uses for GTest::gmock. The @cuda
#   component targets carry their own headers, so consumers' <cublas_v2.h>
#   includes resolve through the dep.
CONVERT_FLAGS="--imports-manifest=$repo_root/scripts/build-lens/cuda-samples-imports.json"

# BAZEL_FLAGS:
#   --repo_env=CC steers BOTH Bazel's cc toolchain and rules_cuda's nvcc
#     `-ccbin` at gcc-12 (CUDA 12.0's nvcc caps host gcc at 12; the default
#     /usr/bin/gcc is 13/14 here and nvcc errors "unsupported GNU version").
#   --check_direct_dependencies=off silences the rules_cc version-skew warning
#     (the base lens pins rules_cc 0.0.17; rules_cuda pulls a newer rules_cc into
#     the resolved graph — benign).
#   --@rules_cuda//cuda:archs=sm_80: the converter drops the samples' baked
#     arch list (toolchain concern; see the CONVERT_FLAGS note above), and
#     rules_cuda's default arch is too OLD for the suite's floor — the samples
#     hard-set 75+ and several need sm_60/70/80 intrinsics (atomicAdd_system,
#     __grid_constant__, fp16/bf16 tensor-core paths) that fail nvcc outright
#     on the default. sm_80 is within both the suite's declared floor and
#     CUDA 12.0 nvcc's range.
BAZEL_FLAGS="--repo_env=CC=${BSB_CUDA_HOST_CC:-/usr/bin/gcc-12} --check_direct_dependencies=off --@rules_cuda//cuda:archs=sm_80"

# EMIT_INSTALL_EXPORT=0: the samples are executables, not an installable library
# with an exported config bundle — nothing to exercise.
EMIT_INSTALL_EXPORT=0

# CONFIGURE_PRUNE_SUBDIRS: drop the 9_CUDA_Tile group from the whole-tree
# configure. Its tileMatmulAutotuner hard-gates on `find_program(tileiras
# REQUIRED)` (a CUDA Tile-IR tool that ships with CUDA 13+, absent in 12.0),
# and the whole group compiles with `--enable-tile` nvcc flags 12.0 rejects —
# the group is unbuildable on this toolkit, not merely mis-detected, so the
# honest whole-tree scope on CUDA 12.0 is "the suite minus Tile-IR". The lens
# stages a pruned copy; the upstream clone is untouched. Remove this line when
# the provisioned toolkit ships tileiras (ROADMAP option c).
# Beyond 9_CUDA_Tile, the 2026-06-12 whole-tree sweep converged on 41 samples
# that are UNBUILDABLE on the provisioned CUDA 12.0 toolkit (not converter
# gaps -- cmake would fail identically): the driver-API/nvrtc/libNVVM families
# need 12.5+'s CUctxCreateParams; the cufft samples need newer cufft enums and
# callbacks; cubDevice*/libcuxx* need newer CCCL (cub device_find/transform/
# segmented_scan headers, cuda/mdspan, cuda/random, cuda::std::identity);
# graphConditionalNodes / memMapIPCDrv / LargeKernelParameter /
# UnifiedMemoryPerf / conjugateGradientMultiDeviceCG need newer runtime APIs;
# jitLto needs nvJitLinkVersion; the EGLStream pair needs EGL interop the
# host lacks. ONE exception: eigenvalues is not floor-bound — it trips the
# textual-include-of-SOURCE idiom (bisect_util.cu quote-included by the .cuh
# kernels; the sibling staging walk covers headers, not .cu) — a real
# converter staging gap tracked in ROADMAP's Later; unprune it when that
# lands. Remove the rest as the provisioned toolkit floor rises
# (ROADMAP option c).
CONFIGURE_PRUNE_SUBDIRS="cpp/CMakeLists.txt:9_CUDA_Tile
    cpp/0_Introduction/CMakeLists.txt:clock_nvrtc \
    cpp/0_Introduction/CMakeLists.txt:matrixMulDrv \
    cpp/0_Introduction/CMakeLists.txt:matrixMul_nvrtc \
    cpp/0_Introduction/CMakeLists.txt:simpleAssert_nvrtc \
    cpp/0_Introduction/CMakeLists.txt:simpleAtomicIntrinsics_nvrtc \
    cpp/0_Introduction/CMakeLists.txt:simpleDrvRuntime \
    cpp/0_Introduction/CMakeLists.txt:simpleTextureDrv \
    cpp/0_Introduction/CMakeLists.txt:vectorAddDrv \
    cpp/0_Introduction/CMakeLists.txt:vectorAddMMAP \
    cpp/0_Introduction/CMakeLists.txt:vectorAdd_nvrtc \
    cpp/2_Concepts_and_Techniques/CMakeLists.txt:EGLStream_CUDA_CrossGPU \
    cpp/2_Concepts_and_Techniques/CMakeLists.txt:EGLStream_CUDA_Interop \
    cpp/2_Concepts_and_Techniques/CMakeLists.txt:eigenvalues \
    cpp/2_Concepts_and_Techniques/CMakeLists.txt:inlinePTX_nvrtc \
    cpp/2_Concepts_and_Techniques/CMakeLists.txt:segmentationTreeThrust \
    cpp/2_Concepts_and_Techniques/CMakeLists.txt:threadMigration \
    cpp/3_CUDA_Features/CMakeLists.txt:cdpQuadtree \
    cpp/3_CUDA_Features/CMakeLists.txt:graphConditionalNodes \
    cpp/3_CUDA_Features/CMakeLists.txt:memMapIPCDrv \
    cpp/4_CUDA_Libraries/CMakeLists.txt:conjugateGradientMultiDeviceCG \
    cpp/4_CUDA_Libraries/CMakeLists.txt:cubDeviceFind \
    cpp/4_CUDA_Libraries/CMakeLists.txt:cubDeviceSegmentedScan \
    cpp/4_CUDA_Libraries/CMakeLists.txt:cubDeviceTransform \
    cpp/4_CUDA_Libraries/CMakeLists.txt:histEqualizationNPP \
    cpp/4_CUDA_Libraries/CMakeLists.txt:jitLto \
    cpp/4_CUDA_Libraries/CMakeLists.txt:libcuxxMdspan \
    cpp/4_CUDA_Libraries/CMakeLists.txt:libcuxxRandom \
    cpp/4_CUDA_Libraries/CMakeLists.txt:simpleCUFFT \
    cpp/4_CUDA_Libraries/CMakeLists.txt:simpleCUFFT_2d_MGPU \
    cpp/4_CUDA_Libraries/CMakeLists.txt:simpleCUFFT_MGPU \
    cpp/4_CUDA_Libraries/CMakeLists.txt:simpleCUFFT_callback \
    cpp/4_CUDA_Libraries/CMakeLists.txt:watershedSegmentationNPP \
    cpp/5_Domain_Specific/CMakeLists.txt:BlackScholes_nvrtc \
    cpp/5_Domain_Specific/CMakeLists.txt:binomialOptions_nvrtc \
    cpp/5_Domain_Specific/CMakeLists.txt:convolutionFFT2D \
    cpp/5_Domain_Specific/CMakeLists.txt:quasirandomGenerator_nvrtc \
    cpp/6_Performance/CMakeLists.txt:LargeKernelParameter \
    cpp/6_Performance/CMakeLists.txt:UnifiedMemoryPerf \
    cpp/7_libNVVM/CMakeLists.txt:device-side-launch \
    cpp/7_libNVVM/CMakeLists.txt:simple cpp/7_libNVVM/CMakeLists.txt:uvmlite"

# BUILD_LENS_IGNORE_REJ=1: the full-tree diagnostic survey may flag rejections
# in samples that need external tools/libs (e.g. the 9_CUDA_Tile group's
# `find_program(tileiras REQUIRED)` — a CUDA Tile-IR tool absent in 12.0 — fails
# CONFIGURE for the whole tree). When surveying a single clean sample subdir
# that has no such blocker this is a no-op; it's set so a scoped survey isn't
# gated by an unrelated sample's diagnostic.
BUILD_LENS_IGNORE_REJ=1

# ---------------------------------------------------------------------------
# REMAINING WORK to green the FULL cuda-samples suite (not just one sample):
#
#  1. Whole-tree configure blocker: the top-level CMakeLists unconditionally
#     `add_subdirectory(9_CUDA_Tile)`, whose tileMatmulAutotuner does
#     `find_program(TILEIRAS_EXECUTABLE tileiras REQUIRED)`. `tileiras` ships
#     only with newer CUDA Tile-IR toolkits, so configure FAILS on CUDA 12.0
#     before any convert. Options: (a) survey a sample-group subdir that
#     excludes 9_CUDA_Tile; (b) teach the lens a per-project "prune
#     add_subdirectory" knob; (c) provision a CUDA toolkit new enough to ship
#     tileiras. NB this is COUPLED to item 3 below: a clean per-sample survey
#     (configure at the sample, avoiding tileiras) breaks the Common/ anchor,
#     while a whole-repo configure (anchors Common/ correctly) trips tileiras.
#
#  2. find_package(CUDAToolkit) library samples: the 4_CUDA_Libraries group
#     links cuBLAS/cuFFT/cuSPARSE/etc. via find_package(CUDAToolkit) IMPORTED
#     targets (CUDA::cublas, …). Standalone these surface as
#     find-package-dep-unresolved (like protobuf's ZLIB) — they need an imports
#     manifest mapping CUDA::* to the rules_cuda toolchain's library labels
#     (@cuda//:cublas, …), the same imports-manifest path abseil uses for
#     GTest::gmock. Scope: a cuda-samples-imports.json + --imports-manifest in
#     CONVERT_FLAGS. The non-library groups (0_Introduction, most of
#     2_Concepts/3_CUDA_Features) need none of this.
#
# FIXED this round (a surveyed sample now builds green):
#   - config-root/anchor-root decoupling — `--element-source-root` (wired from
#     ELEMENT_SOURCE_ROOT) forces the converter to anchor labels at the overlay
#     (repo) root while cmake configures per-sample, so srcs land at
#     cpp/<group>/<sample>/ matching the overlay instead of "missing input".
#   - the repo-root Common/ include (`include_directories(../../../Common)`),
#     outside the per-sample cmake root but inside the overlay root, is now
#     anchored labelRoot-relative and surfaced as an include root → split
#     synthesizes Common:Common_headers and the sample deps on it (helper_cuda.h
#     resolves).
#   - nvcc GPU-arch flags (`--generate-code` / `-gencode`) DROPPED from both
#     copts AND linkopts (lower's isNvccArchFlag) — rules_cuda rejects per-target
#     arch flags; arch is a `@rules_cuda//cuda:archs` toolchain concern, which
#     also sidesteps CUDA 12.0's Blackwell-arch (compute_100/110/120) rejection.
#
# PROVEN (the CUDA infra this conf rides on):
#   - converter emits cuda_library/cuda_binary + the @rules_cuda load for `.cu`
#     targets (KindCudaLibrary lowering); copts/linkopts are de-shell-quoted and
#     arch-flag-free.
#   - rules_cuda's local toolchain (scripts/provision-cuda-root.sh root, gcc-12
#     host) compiles `.cu` end-to-end (CUDA 12.0.140 + gcc-12 provisioned via
#     `apt-get install nvidia-cuda-toolkit gcc-12` + provision-cuda-root.sh).
