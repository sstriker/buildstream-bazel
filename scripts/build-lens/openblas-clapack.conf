# Build-lens config for the OpenBLAS **C_LAPACK** survey variant — the sibling
# of openblas.conf, surveyed as a SEPARATE member `openblas-clapack` pointing at
# the SAME OpenBLAS checkout. Schema + how each var is applied: see
# scripts/run-survey.sh. Survey notes: docs/survey-corpus.md (OpenBLAS rows).
#
# WHY TWO VARIANTS. The default `openblas` member builds the real **Fortran**
# reference LAPACK (lowered to fortran_library; see retagFortranTargets). This
# `openblas-clapack` member keeps the **C_LAPACK** path alive: OpenBLAS ships an
# f2c-translated C copy of the reference LAPACK, selected with C_LAPACK=1 +
# NOFORTRAN=1. The two paths exercise DIFFERENT converter machinery and have
# historically each teased out distinct issues, so surveying both protects both:
#   - C_LAPACK path → the generated-C-source handling: GenerateNamedObjects
#     absolute/source-root includes, the transitive micro-kernel textual-header
#     closure, file(RENAME) config.h recovery, the per-source/per-language
#     compile-group split (the -mfma FMA kernels + the .S ASM TUs).
#   - Fortran path  → the fortran_library lowering: module-dependency ordering
#     (la_constants.mod), the gfortran-via-cc-driver compile, CcInfo interop.
# A regression in one path shows up as a build-status flip on that member while
# the other stays green — a sharper signal than a single combined member.
#
# Everything else mirrors openblas.conf (deterministic-arch HASWELL pin,
# BUILD_TESTING/BENCHMARKS off, NO_CBLAS); the ONLY difference is the
# NOFORTRAN=1 C_LAPACK=1 pair that swaps the Fortran reference LAPACK for its
# f2c'd C translation. See openblas.conf for the full rationale of each shared
# flag (getarch host-probe avoidance, the CBLAS reference-test symbol collision,
# the CMAKE_C_FLAGS=-mfma kernel flag). When the per-source compile-group split
# lands on main (it retires the build-wide -mfma in favor of the codemodel's own
# per-source FMA-kernel groups), drop -mfma from BOTH this and openblas.conf.
_OB_FLAGS='--cmake-define NOFORTRAN=1 --cmake-define C_LAPACK=1 --cmake-define CMAKE_SYSTEM_NAME=Linux --cmake-define CMAKE_SYSTEM_PROCESSOR=x86_64 --cmake-define CORE=HASWELL --cmake-define TARGET=HASWELL --cmake-define TARGET_CORE=HASWELL --cmake-define BUILD_TESTING=OFF --cmake-define BUILD_BENCHMARKS=OFF --cmake-define NO_CBLAS=1 --cmake-define CMAKE_C_FLAGS=-mfma'
DIAG_CONVERT_FLAGS="$_OB_FLAGS"
CONVERT_FLAGS="$_OB_FLAGS"
