# Build-lens config for protobuf — sourced by run-survey.sh.
#
# protobuf depends on abseil via find_package(absl) (protobuf_ABSL_PROVIDER=
# package). For the lens to convert hermetically:
#   - abseil must be INSTALLED on the host so find_package(absl) SUCCEEDS at
#     convert time (else protobuf silently FetchContent-downloads abseil into
#     the build dir, which the lens overlay can't stage). Install once:
#       cmake -S $ABSEIL_DIR -B /tmp/absl-build -G Ninja \
#         -DCMAKE_INSTALL_PREFIX=/tmp/absl-install -DABSL_ENABLE_INSTALL=ON \
#         -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_STANDARD=17
#       cmake --build /tmp/absl-build --target install
#     (TODO: fold into the SessionStart hook so it's provisioned automatically.)
#   - CMAKE_PREFIX_PATH points find_package at the install.
#   - protobuf-imports.json maps the find_package absl imported targets
#     (absl::strings, …, 78 compiled libs) to @abseil-cpp BCR labels, so the
#     converter emits hermetic @abseil-cpp deps instead of HOST cc_imports of
#     the installed .a files (non-hermetic — wouldn't build in the sandbox).
#     Generated from abseil's own BUILD.bazel names (= the BCR module); see
#     ROADMAP for the auto-gen rule.
_PB_FLAGS="--cmake-define protobuf_BUILD_TESTS=OFF --cmake-define protobuf_ABSL_PROVIDER=package --cmake-define CMAKE_PREFIX_PATH=/tmp/absl-install --imports-manifest=$repo_root/scripts/build-lens/protobuf-imports.json"
DIAG_CONVERT_FLAGS="$_PB_FLAGS"
CONVERT_FLAGS="$_PB_FLAGS"
EXTRA_BAZEL_DEPS='bazel_dep(name = "abseil-cpp", version = "20260107.1")'
BAZEL_FLAGS='--incompatible_autoload_externally=+cc_library,+cc_test,+cc_binary'
