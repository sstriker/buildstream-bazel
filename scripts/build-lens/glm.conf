# Build-lens config for glm — sourced by scripts/run-survey.sh's build lens.
#
# glm's test/CMakeLists.txt adds `-Werror` (gcc) / `-Werror -Weverything`
# (clang). Under GCC 13 the toolchain's default -Wall promotes -Wclass-memaccess
# inside glm's own gtc/packing.inl (intentional memcpy over its packed vector
# types) to an error. CMAKE_CXX_FLAGS=-w inhibits all warnings so -Werror has
# nothing to promote, order-independently, while leaving glm's C++
# auto-detection intact. (glm's own GLM_DISABLE_AUTO_DETECTION knob also drops
# the test -Werror but forces GLM_FORCE_CXX_UNKNOWN, which zeroes GLM_LANG and
# disables glm's std::hash specializations — breaking the gtx_hash tests.)
CONVERT_FLAGS='--cmake-define CMAKE_CXX_FLAGS=-w'
