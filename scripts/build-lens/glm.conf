# Build-lens config for glm — sourced by run-survey.sh's try_bazel_build.
# Schema + how each var is applied: see scripts/run-survey.sh. Rationale for
# this project's knobs: docs/survey-corpus.md "Build-lens status" / the
# -Werror note.
#
# glm's test/CMakeLists.txt adds -Werror (gcc) / -Werror -Weverything (clang).
# Under Bazel's default toolchain -Wall that promotes a latent
# -Wclass-memaccess in glm's own gtc/packing.inl (memcpy over its packed
# vector types — intentional, not a bug) to an error. We can't reach for glm's
# GLM_DISABLE_AUTO_DETECTION knob: it drops the test -Werror but also forces
# GLM_FORCE_CXX_UNKNOWN, zeroing GLM_LANG and disabling glm's C++11 std::hash
# specializations — breaking the gtx_hash tests with deleted-function errors.
# CMAKE_CXX_FLAGS=-w inhibits all warnings (so -Werror has nothing to promote,
# order-independently) while leaving C++ auto-detection intact, so the full
# test suite — hash included — compiles.
CONVERT_FLAGS='--cmake-define CMAKE_CXX_FLAGS=-w'
