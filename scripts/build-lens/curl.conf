# Build-lens config for curl — sourced by run-survey.sh's try_bazel_build.
# Schema + how each var is applied: see scripts/run-survey.sh.
#
# curl converts CLEAN (0 rejections) and `bazel build //...` is GREEN with the
# test surface configured ON — libcurl, the curl CLI, the test codegen, and all
# the EXCLUDE_FROM_ALL test executables (emitted + buildable on request).
#
#   - BUILD_TESTING=ON — builds curl's `tests/` tree (CMakeLists 1885-1910).
#     The test executables (tests/{libtest,server,unit}, ~298 of them) are
#     `add_executable(... EXCLUDE_FROM_ALL ...)`: NOT in cmake's default build,
#     so the converter emits them `manual`-tagged — excluded from the `//...`
#     wildcard (matching cmake), still buildable by label. The phony test-RUN
#     wrappers (`add_custom_target(test-ci ... runtests.pl … "$TFLAGS")`, no
#     ALL) are likewise `manual`-tagged out of the default build. The test
#     codegen genrules (e.g. `perl mk-lib1521.pl < include/curl/curl.h
#     lib1521.c`) build via the ninja-genrule exec-root + cd-stripped-output
#     anchoring fixes.
#
#   - BUILD_LIBCURL_DOCS=OFF + ENABLE_CURL_MANUAL=OFF — gate curl's
#     `add_subdirectory(docs)` (CMakeLists line 455-459, 1895) and the embedded
#     `-M/--manual` text. The docs/ tree is manpage generation (perl helpers
#     `cd2nroff`/`managen`/`mkhelp.pl` over ~300 `.md` files) — documentation
#     output, not the library or its tests. Off here, the "build the library +
#     its code, not its docs" line eigen/llvm apply.
#
# curl's find_package(ZLIB) resolves to the host libz; the converter lifts it to
# a `-lz` linkopt (the same host-system-lib path LLVM's tools exercised). Other
# protocol deps (OpenSSL/nghttp2/…) are opt-in and stay off in the default
# configure, so the lens builds libcurl + the curl CLI against the base surface.
_CURL_FLAGS='--cmake-define BUILD_TESTING=ON --cmake-define BUILD_LIBCURL_DOCS=OFF --cmake-define ENABLE_CURL_MANUAL=OFF'
DIAG_CONVERT_FLAGS="$_CURL_FLAGS"
CONVERT_FLAGS="$_CURL_FLAGS"
