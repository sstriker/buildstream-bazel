# Build-lens config for curl — sourced by run-survey.sh's try_bazel_build.
# Schema + how each var is applied: see scripts/run-survey.sh.
#
# curl converts CLEAN (0 rejections). The build lens scopes to curl's LIBRARY
# + CLI, not its test suite — the "build the library, not its test tree" rule
# the other members apply (eigen/cutlass/openblas/llvm).
#
#   - BUILD_TESTING=OFF — gates curl's `add_subdirectory(tests)` (CMakeLists
#     line 1885-1910). The tests/ tree is a set of `add_custom_target`s that run
#     the perl test harness (`runtests.pl … "$TFLAGS"`): phony test-RUN targets,
#     not file producers, that the converter lowers to genrules with stamp
#     outputs they never write (and whose `$TFLAGS` shell var trips Bazel's
#     genrule Make-variable parser). They're a test surface, not the library —
#     off here, like every other member's test tree.
#
#   - BUILD_LIBCURL_DOCS=OFF + ENABLE_CURL_MANUAL=OFF — gate curl's
#     `add_subdirectory(docs)` (CMakeLists line 455-459, 1895) and the embedded
#     `-M/--manual` text. The docs/ tree is manpage generation: genrules that run
#     perl helper scripts (`scripts/cd2nroff`, `managen`, `mkhelp.pl`) over the
#     ~300 `docs/**/*.md` sources. The converter doesn't yet stage a genrule's
#     invoked-script inputs (the script isn't in srcs → "Can't open perl script
#     … No such file"), so the doc genrules fail at action time. Docs are not the
#     library — off here, the "build the library, not its docs" rule eigen/llvm
#     apply. (Staging genrule script inputs is a tracked converter follow-up that
#     would let the docs — and curl's perl test harness — build; see the llvm/
#     curl rows + ROADMAP.)
#
# curl's find_package(ZLIB) resolves to the host libz; the converter lifts it to
# a `-lz` linkopt (the same host-system-lib path LLVM's tools exercised). Other
# protocol deps (OpenSSL/nghttp2/…) are opt-in and stay off in the default
# configure, so the lens builds libcurl + the curl CLI against the base surface.
_CURL_FLAGS='--cmake-define BUILD_TESTING=OFF --cmake-define BUILD_LIBCURL_DOCS=OFF --cmake-define ENABLE_CURL_MANUAL=OFF'
DIAG_CONVERT_FLAGS="$_CURL_FLAGS"
CONVERT_FLAGS="$_CURL_FLAGS"
