# Build-lens config for libpng — sourced by run-survey.sh.
# libpng generates pnglibconf.h and pngprefix.h via `cmake -P
# scripts/cmake/gensrc.cmake` custom commands (4 unsupported-custom-command-
# script rejections). Bake the script outputs at convert time: the survey
# already runs cmake (File API), so --cmake-script-bake captures the generated
# bytes and emits genrules that materialize them — no cmake at build time.
# find_package(ZLIB) resolves to the host libz (-lz), the same host-system-lib
# path curl/LLVM use.
_PNG_FLAGS='--cmake-script-bake=true'
DIAG_CONVERT_FLAGS="$_PNG_FLAGS"
CONVERT_FLAGS="$_PNG_FLAGS"
