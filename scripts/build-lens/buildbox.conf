# Build-lens config for buildbox (BuildGrid/buildbox) — sourced by run-survey.sh.
#
# buildbox is a BuildStream-ecosystem REAPI tooling monorepo. It exercises TWO
# patterns the rest of the corpus doesn't:
#   1. A CUSTOM protoc codegen wrapper — protoc_compile() in
#      cmake/BuildboxCommonProtoc.cmake — rather than the standard
#      protobuf_generate / grpc_cpp_plugin macros the grpc/protobuf members use.
#      The converter recovers each protoc/grpc_cpp_plugin invocation as a
#      genrule (42 of them across the REAPI proto tree: build/bazel/remote/...,
#      google/rpc, longrunning, api, bytestream, buildbox, buildgrid).
#   2. A monorepo of ~20 small tools gated by tri-state
#      enable_tool/enable_linux_tool(AUTO/ON/OFF) — a config-prune surface.
#
# SCOPE: the CORE (common / commonmetrics / protos) — the part with the new
# codegen pattern. The tools (casd/worker/recc/fuse/run-*) are dev surfaces with
# their own heavy deps (curl/nlohmann/fuse3); disabled like
# cutlass's examples/tests via TOOLS=OFF + OCI=OFF + BUILD_TESTING=OFF.
#
# PROVISIONING (the convert needs cmake CONFIGURE to resolve find_package):
#   - abseil >= 20230125 (buildbox links absl::log_initialize, which Ubuntu's
#     apt absl 20220623 lacks). The SessionStart hook installs a recent abseil
#     from source to /tmp/absl-install by default (tools/install-survey-deps.sh);
#     CMAKE_PREFIX_PATH points there. NOTE: configure (codemodel) doesn't LINK,
#     so the convert + structural lenses only need find_package to SUCCEED — the
#     apt protobuf/grpc/protoc/grpc_cpp_plugin/uuid (from /usr) suffice there.
#   - protoc + grpc_cpp_plugin binaries (protoc_compile find_program), uuid, and
#     tomlplusplus — the last is a CORE dep (BuildboxCommonConfig.cmake is
#     included regardless of TOOLS=OFF; its pkg_check_modules(tomlplusplus
#     REQUIRED) hard-fails configure without it):
#     apt protobuf-compiler protobuf-compiler-grpc libgrpc++-dev uuid-dev \
#         libtomlplusplus-dev.
#
# STATUS: structural lenses GREEN (0 rejections, 0 coverage drops, 0 todos; 14
# idiom findings — 12 empty-cc-library proto wrapper libs + 2
# pch-speed-not-replicated from common's target_precompile_headers). The build
# lens is a FOLLOW-ON: it needs the grpc.conf-class treatment — a
# buildbox-imports.json mapping the find_package imported targets
# (absl::*, protobuf::*, gRPC::grpc++, OpenSSL::*) to @BCR labels, plus the
# hermetic-protoc genrule reanchoring (the recovered genrules currently call
# host protoc/grpc_cpp_plugin; cf. grpc.conf's reanchorBuildDirCopyGenrule +
# $(execpath @protobuf//:protoc)). Until then the build lens self-skips.
_BB_FLAGS="--cmake-define TOOLS=OFF --cmake-define OCI=OFF --cmake-define BUILD_TESTING=OFF \
--cmake-define CMAKE_PREFIX_PATH=/tmp/absl-install;/usr \
--cmake-define CMAKE_POLICY_VERSION_MINIMUM=3.5"
DIAG_CONVERT_FLAGS="$_BB_FLAGS"
CONVERT_FLAGS="$_BB_FLAGS"
