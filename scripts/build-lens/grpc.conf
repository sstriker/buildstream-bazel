# Build-lens config for grpc — sourced by run-survey.sh.
#
# grpc is the deepest find_package graph in the corpus: zlib, c-ares, SSL
# (BoringSSL/OpenSSL), protobuf, abseil, re2 — all driven via gRPC_*_PROVIDER=
# package so the lens converts grpc ALONE (deps resolve to @BCR labels) rather
# than vendoring every submodule. For find_package to SUCCEED at convert time:
#   - abseil + protobuf + re2 are host-INSTALLED (PIC, C++17):
#       sh tools/install-survey-deps.sh        # /tmp/absl-install
#       (protobuf-install / re2-install built against absl — see ROADMAP)
#   - c-ares, OpenSSL, zlib come from the system (apt: libc-ares-dev libssl-dev
#     zlib1g-dev), found via CMAKE_PREFIX_PATH=/usr.
#   - grpc-imports.json maps every find_package imported target
#     (absl::*, protobuf::*, re2::re2, c-ares::cares, OpenSSL::SSL/Crypto,
#     ZLIB::ZLIB) to its @BCR label, so the converter emits hermetic deps
#     instead of HOST cc_imports of the installed .a files. Reuses protobuf's
#     abseil element (192 exports) + the absl_umbrella for abseil's broad
#     find_package include root.
_GRPC_FLAGS="--cmake-define gRPC_BUILD_TESTS=OFF --cmake-define gRPC_BENCHMARK_PROVIDER=none \
--cmake-define gRPC_ZLIB_PROVIDER=package --cmake-define gRPC_CARES_PROVIDER=package \
--cmake-define gRPC_SSL_PROVIDER=package --cmake-define gRPC_PROTOBUF_PROVIDER=package \
--cmake-define gRPC_ABSL_PROVIDER=package --cmake-define gRPC_RE2_PROVIDER=package \
--cmake-define CMAKE_PREFIX_PATH=/tmp/absl-install;/tmp/protobuf-install;/tmp/re2-install;/usr \
--dump-vars=true --imports-manifest=$repo_root/scripts/build-lens/grpc-imports.json"
DIAG_CONVERT_FLAGS="$_GRPC_FLAGS"
CONVERT_FLAGS="$_GRPC_FLAGS"
EXTRA_BAZEL_DEPS='bazel_dep(name = "abseil-cpp", version = "20260107.1")
bazel_dep(name = "protobuf", version = "31.1")
bazel_dep(name = "re2", version = "2024-07-02.bcr.1")
bazel_dep(name = "boringssl", version = "0.20240913.0")
bazel_dep(name = "zlib", version = "1.3.1.bcr.5")
bazel_dep(name = "c-ares", version = "1.34.5.bcr.1")'
BAZEL_FLAGS='--incompatible_autoload_externally=+cc_library,+cc_test,+cc_binary --sandbox_add_mount_pair=/tmp'
# GREEN: grpc converts 0-rej, analyzes, and `bazel build //...` completes
# successfully (all 5 gRPC C++ service-stub codegens — channelz + reflection —
# build). The protoc-genrule path that got it there:
#   - reanchorBuildDirCopyGenrule (lower): drops the producerless `<build>/protos`
#     configure-time copy srcs, reanchors `-I .`/the proto arg to the source
#     tree, anchors the output-root to $(RULEDIR), stages the proto `import`
#     closure, drops host-tool basename phantoms, and swaps host protoc for the
#     hermetic `$(execpath @protobuf//:protoc)` (gencode matches the
#     rules_cc-forced BCR runtime 33.4 — hence no protobuf version pin needed);
#   - the consumer gets the gens generated-output root on `includes`;
#   - emit/split re-relativizes the genrule's $(RULEDIR)/gens output-dir + bare
#     tool labels on the move into the gens/ sub-package, and suppresses the
#     gen-output-root header-lib dep across the codegen tool's dep closure (the
#     grpc_cpp_plugin → grpc_plugin_support → gens_headers → … cycle break).
# --sandbox_add_mount_pair=/tmp is still needed for the host protobuf WKT include
# (-I /tmp/protobuf-install/include) the protoc genrules pass.

# Reuse protobuf's absl umbrella (abseil's whole header tree lands on grpc's
# compile line via find_package(absl); strict per-target headers reject the
# ones grpc never declared — the umbrella re-exports abseil's full public
# surface and lower wires it wherever the find_package include dir would drop).
extra_ws_setup() {
    _ws="$1"
    mkdir -p "$_ws/absl_umbrella"
    {
        echo 'load("@rules_cc//cc:defs.bzl", "cc_library")'
        echo ''
        echo 'cc_library('
        echo '    name = "absl",'
        echo '    visibility = ["//visibility:public"],'
        echo '    deps = ['
        while IFS= read -r _lbl; do
            [ -n "$_lbl" ] && printf '        "%s",\n' "$_lbl"
        done < "$repo_root/scripts/build-lens/absl-umbrella-deps.txt"
        echo '    ],'
        echo ')'
    } > "$_ws/absl_umbrella/BUILD.bazel"
}
