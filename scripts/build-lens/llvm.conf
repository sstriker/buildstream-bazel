# Build-lens config for LLVM — sourced by run-survey.sh's try_bazel_build.
# Schema + how each var is applied: see scripts/run-survey.sh. Survey LLVM at
# the buildable subproject `$(LLVM_DIR)/llvm`, NOT the monorepo root (the
# faithful-survey rule — docs/survey-corpus.md pitfall 1).
#
# STATUS (in progress): LLVM has extensive prior build-lens-adjacent work on
# main — the converter renders the monorepo multi-config + split (~376
# per-directory BUILDs), individual leaf libraries compile + archive
# (LLVMSupport, LLVMDemangle, LLVMBitstreamReader, LLVMRemarks), the tablegen
# tool (llvm-min-tblgen) builds, the tablegen genrules run + emit their .inc
# headers, and consumers that #include generated .inc wire up
# (CodegenHeaderConsumers → per-package generated_headers libs). What hasn't
# been driven is a whole-tree `bazel build //...`; this conf is the vehicle for
# that grind. See docs/survey-corpus.md (LLVM rows) for the running blocker log.
#
# Configure flags — trim LLVM to a single, tractable, library-centric shape:
#   - LLVM_TARGETS_TO_BUILD=X86 — one backend instead of all ~20 (cuts the
#     Target/* library + tablegen-genrule graph by an order of magnitude while
#     still exercising the tablegen tier and a real backend).
#   - LLVM_INCLUDE_TESTS/EXAMPLES/BENCHMARKS/DOCS=OFF — drop the non-library dev
#     surfaces (unittests pull GoogleTest; examples/benchmarks/docs aren't the
#     library), mirroring eigen/cutlass's "build the library, not its test tree".
#   - LLVM_INCLUDE_UTILS=ON (default) — KEEP: llvm-min-tblgen + the tablegen
#     utils are load-bearing (the genrules run them).
#   - LLVM_ENABLE_PROJECTS unset — just llvm (no clang/lld/… subprojects).
#   - LLVM_ENABLE_ASSERTIONS=ON — typical dev build; harmless for the lens.
# (cmake's pre-3.5 policy floor is lifted by cmakerun's auto-retry, as for
# OpenBLAS — no flag needed here.)
_LLVM_FLAGS='--cmake-define LLVM_TARGETS_TO_BUILD=X86 --cmake-define LLVM_INCLUDE_TESTS=OFF --cmake-define LLVM_INCLUDE_EXAMPLES=OFF --cmake-define LLVM_INCLUDE_BENCHMARKS=OFF --cmake-define LLVM_INCLUDE_DOCS=OFF --cmake-define LLVM_ENABLE_ASSERTIONS=ON'
DIAG_CONVERT_FLAGS="$_LLVM_FLAGS"
CONVERT_FLAGS="$_LLVM_FLAGS"
