# Build-lens config for LLVM — sourced by run-survey.sh's try_bazel_build.
# Schema + how each var is applied: see scripts/run-survey.sh. Survey LLVM at
# the buildable subproject `$(LLVM_DIR)/llvm`, NOT the monorepo root (the
# faithful-survey rule — docs/survey-corpus.md pitfall 1).
#
# STATUS (in progress): LLVM has extensive prior build-lens-adjacent work on
# main — the converter renders the monorepo multi-config + split (~376
# per-directory BUILDs), individual leaf libraries compile + archive
# (LLVMSupport, LLVMDemangle, LLVMBitstreamReader, LLVMRemarks), the tablegen
# tool (llvm-min-tblgen) builds, the tablegen genrules run + emit their .inc
# headers, and consumers that #include generated .inc wire up
# (CodegenHeaderConsumers → per-package generated_headers libs). What hasn't
# been driven is a whole-tree `bazel build //...`; this conf is the vehicle for
# that grind. See docs/survey-corpus.md (LLVM rows) for the running blocker log.
#
# Configure flags — trim LLVM to a single, tractable, library-centric shape:
#   - LLVM_TARGETS_TO_BUILD=X86 — one backend instead of all ~20 (cuts the
#     Target/* library + tablegen-genrule graph by an order of magnitude while
#     still exercising the tablegen tier and a real backend).
#   - LLVM_INCLUDE_TESTS/EXAMPLES/BENCHMARKS/DOCS=OFF — drop the non-library dev
#     surfaces (unittests pull GoogleTest; examples/benchmarks/docs aren't the
#     library), mirroring eigen/cutlass's "build the library, not its test tree".
#   - LLVM_INCLUDE_UTILS=ON (default) — KEEP: llvm-min-tblgen + the tablegen
#     utils are load-bearing (the genrules run them).
#   - LLVM_ENABLE_PROJECTS unset — just llvm (no clang/lld/… subprojects).
#   - LLVM_ENABLE_ASSERTIONS=ON — typical dev build; harmless for the lens.
# (cmake's pre-3.5 policy floor is lifted by cmakerun's auto-retry, as for
# OpenBLAS — no flag needed here.)
# LLVM_APPEND_VC_REV=OFF: gates (include/llvm/Support/CMakeLists.txt:8) the
# VCSRevision.h custom_command, which runs GenerateVersionFromVCS.cmake over the
# git HEAD to bake the source revision into a header — a build-time VCS stamp the
# build lens doesn't need (and whose HEAD / .cmake inputs aren't staged). OFF
# emits a trivial VCSRevision.h with no git dependency. This is a "don't build
# the version stamp" scoping (like tests off), distinct from the configure-time
# `git rev-parse --git-dir` PROBE the converter now classifies + skips
# (gitRepoLocationQuery). The faithful converter path for a real VCS-stamp
# header is the stamp_values infra (cmake_configure_file stamp_values) — a
# follow-up; see docs/survey-corpus.md (llvm row).
_LLVM_FLAGS='--cmake-define LLVM_TARGETS_TO_BUILD=X86 --cmake-define LLVM_INCLUDE_TESTS=OFF --cmake-define LLVM_INCLUDE_EXAMPLES=OFF --cmake-define LLVM_INCLUDE_BENCHMARKS=OFF --cmake-define LLVM_INCLUDE_DOCS=OFF --cmake-define LLVM_ENABLE_ASSERTIONS=ON --cmake-define LLVM_APPEND_VC_REV=OFF'
DIAG_CONVERT_FLAGS="$_LLVM_FLAGS"
CONVERT_FLAGS="$_LLVM_FLAGS"
# No ELEMENT_SOURCE_ROOT: LLVM is self-contained under llvm/ (nothing escapes
# cmakeSrc), so the converter no longer spuriously promotes labelRoot to the
# monorepo root — labels stay cmakeSrc-relative (single `llvm`) and the default
# cmakeSrc overlay matches them. (See the sourcesEscapeCmakeSrc gate in
# converter/internal/lower; zstd still promotes because its sources DO escape.)

# BUILD_LENS_IGNORE_REJ=1: the diagnostics survey reports 390 rejections, but
# 388 are the benign `unsupported-source-path` "include dir … doesn't exist on
# disk; treated as empty" notices (cmake's forward-declared include shape — a
# strict-mode no-op, the same benign class glog carries). The 2 real ones are
# `unsupported-execute-process`: a `cc -Wl,--version` linker-capability probe
# (configure-time, non-blocking) and a `cmake -E copy_if_different` that
# materializes the generated `llvm/Support/Extension.def` (a generated header,
# build-lens-relevant like config.h — surfaces in the build if load-bearing).
# None are a reason to skip the whole library build, so bypass the cost-
# optimization skip(rej) gate (cutlass precedent) and let try_bazel_build's own
# clean convert be the real test.
BUILD_LENS_IGNORE_REJ=1
