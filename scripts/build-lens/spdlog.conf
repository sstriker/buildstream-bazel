# Build-lens config for spdlog — sourced by run-survey.sh.
#
# spdlog surveys clean with no config; this conf exists to ENABLE THE
# TEST SUITE (SPDLOG_BUILD_TESTS defaults OFF upstream). The tests do
# find_package(Catch2 3 QUIET) with a FetchContent network fallback the
# lens overlay can't stage, so (the protobuf↔absl pattern):
#   - Catch2 v3.5.3 (the corpus pin) is HOST-INSTALLED to
#     /tmp/catch2-install by the SessionStart hook via
#     tools/install-survey-deps.sh; CMAKE_PREFIX_PATH points
#     find_package at it, so the packaged version is used (no network).
#   - spdlog-imports.json maps the imported targets
#     (Catch2::Catch2WithMain, Catch2::Catch2) onto hermetic @catch2
#     BCR labels (3.5.3 is in the BCR), so the converted cc_test deps
#     on @catch2//:catch2_main instead of HOST cc_imports of the
#     installed .a's. The manifest's umbrella maps the find_package
#     include root (/tmp/catch2-install/include) onto @catch2//:catch2
#     wherever lower would otherwise drop the out-of-tree -I.
_SPDLOG_FLAGS="--cmake-define SPDLOG_BUILD_TESTS=ON --cmake-define CMAKE_PREFIX_PATH=/tmp/catch2-install --imports-manifest=$repo_root/scripts/build-lens/spdlog-imports.json"
DIAG_CONVERT_FLAGS="$_SPDLOG_FLAGS"
CONVERT_FLAGS="$_SPDLOG_FLAGS"
EXTRA_BAZEL_DEPS='bazel_dep(name = "catch2", version = "3.5.3")'
# catch2 3.5.3's BCR BUILD uses native cc_library without load() — bazel 9
# removed the autoload, so re-enable it for the external module (same flag
# protobuf.conf carries for its deps).
BAZEL_FLAGS='--incompatible_autoload_externally=+cc_library,+cc_test,+cc_binary'
