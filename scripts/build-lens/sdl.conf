# Build-lens config for SDL3 — sourced by run-survey.sh.
#
# SDL's video backends need system dev headers: X11 (present in the base image)
# plus OpenGL / GLES / EGL. SDL vendors GLES2/GLES3/EGL/KHR under
# src/video/khronos but NOT the legacy GLES1 (`<GLES/glplatform.h>`), and its
# cmake auto-enables the OpenGL/GLES/EGL render backends. Provision the headers
# once with `sh tools/install-survey-deps.sh` (installs libgles-dev →
# GL/GLES/EGL/GLX headers + .so stubs); without them the GL backends fail
# "GLES/glplatform.h: No such file".
#
# SDL_REVISION set to a static value makes `if(NOT SDL_REVISION)` (CMakeLists
# 3151) skip git_describe — dropping the non-hermetic git execute_process
# (GetGitRevisionDescription.cmake, "git is a stamp / non-hermetic driver").
# SDL_revision.h is then a configure_file bake instead of a git probe.
_SDL_FLAGS='--cmake-define SDL_REVISION=SDL3-survey'
DIAG_CONVERT_FLAGS="$_SDL_FLAGS"
CONVERT_FLAGS="$_SDL_FLAGS"
