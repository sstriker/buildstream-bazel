# Build-lens config for zstd — sourced by run-survey.sh's try_bazel_build.
# Schema + how each var is applied: see scripts/run-survey.sh. Rationale for
# this project's knobs: docs/survey-corpus.md "Build-lens status" (zstd row).
#
# zstd is a SUBDIR-CMAKE project: its buildable CMake root is <repo>/build/cmake
# (the surveyed dir), but its actual library + program SOURCES live at
# <repo>/lib and <repo>/programs — SIBLINGS of build/, OUTSIDE the cmake root.
# build/cmake/lib/CMakeLists.txt does `file(GLOB ... ${LIBRARY_DIR}/common/*.c)`
# where LIBRARY_DIR = ${CMAKE_CURRENT_SOURCE_DIR}/../../lib, i.e. <repo>/lib.
#
# The converter handles this correctly already (the #303 umbrella/workspace-root
# path): pointed at build/cmake it walks up, finds the repo root via its `.git`
# marker, and anchors every source label to that root — emitting the cmake-glue
# library target in elements/zstd/build/cmake/lib/BUILD.bazel with
# `srcs = ["//elements/zstd/lib:common/debug.c", ...]` etc. Those labels only
# resolve when the WHOLE repo is staged under elements/zstd/ (so the real
# lib/ + programs/ source packages exist on disk), NOT just the build/cmake
# subtree the lens overlays by default.
#
# ELEMENT_SOURCE_ROOT redirects the overlay to the repo root accordingly, while
# the lens keeps configuring cmake at the surveyed build/cmake dir ($_bb_src).
# $_bb_src is <repo>/build/cmake, so the repo root is two levels up; resolve it
# absolutely so the `cp -a` source is unambiguous regardless of $PWD.
ELEMENT_SOURCE_ROOT="$(CDPATH= cd -- "$_bb_src/../.." && pwd)"
