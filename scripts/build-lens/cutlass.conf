# Build-lens config for cutlass (NVIDIA CUTLASS) — sourced by run-survey.sh's
# build lens. Schema + how each var is applied: see scripts/run-survey.sh.
#
# cutlass's CORE is a HEADER-ONLY C++ template library (`project(CUTLASS
# ... LANGUAGES CXX)`; the whole `include/` tree is .hpp/.inl templates, no
# compiled .cu in the library itself). Everything that carries `.cu` device
# sources — the unit tests, examples, the `tools/` library + profiler — is a
# DEV SURFACE layered on top, exactly like eigen's Fortran BLAS/test/doc
# surfaces. So the library build disables those surfaces and converts to the
# single header `cc_library(name = "CUTLASS")`, which builds green with the
# plain cc toolchain (header-only: no nvcc needed to COMPILE, only to
# CONFIGURE — see below).
#
#   - CUTLASS_ENABLE_TESTS=OFF     — the GTest-based unit tests; ~1000 `.cu`
#                                    device-code translation units (a CUDA dev
#                                    surface, not the library).
#   - CUTLASS_ENABLE_EXAMPLES=OFF  — the examples/ programs (`.cu` cc_binary
#                                    demos), like eigen's doc/demos.
#   - CUTLASS_ENABLE_TOOLS=OFF     — the tools/ library + util (compiles `.cu`).
#   - CUTLASS_ENABLE_PROFILER=OFF  — the profiler executable (`.cu`).
#   - CUTLASS_ENABLE_LIBRARY=OFF   — the optional instantiation library (`.cu`
#                                    kernels generated + compiled). The header
#                                    library (`include/`) is independent of it.
# With these OFF the convert is 0 rejections / 0 idioms and emits just the
# header cc_library.
#
# CONFIGURE still requires nvcc on PATH: cutlass's CUDA.cmake does
# `enable_language(CUDA)` + `find_package(CUDAToolkit REQUIRED)` unconditionally
# (before the ENABLE_* gates), so cmake configure — which the converter runs to
# get the File API codemodel — fails without a CUDA toolkit. Provision it with
# the SessionStart hook's BSB_PROVISION_CUDA=1 path (apt nvidia-cuda-toolkit);
# see docs/survey-corpus.md "CUDA toolkit".
#
# EMIT_INSTALL_EXPORT=0: cutlass's install(EXPORT) flow generates an
# NvidiaCutlassConfig.cmake via configure_file; the header-only library build
# doesn't need the install-export config bundle exercised (there's no compiled
# artifact to export an IMPORTED_LOCATION for), and emitting it pulls in the
# config-mode write_file machinery for no build-lens signal. Off keeps the lens
# focused on "does the header library build".
EMIT_INSTALL_EXPORT=0
CONVERT_FLAGS='--cmake-define CUTLASS_ENABLE_TESTS=OFF --cmake-define CUTLASS_ENABLE_EXAMPLES=OFF --cmake-define CUTLASS_ENABLE_TOOLS=OFF --cmake-define CUTLASS_ENABLE_PROFILER=OFF --cmake-define CUTLASS_ENABLE_LIBRARY=OFF'

# BUILD_LENS_IGNORE_REJ=1: the FULL-tree diagnostic survey (which runs WITHOUT
# the CONVERT_FLAGS above) flags 1 rejection — an `unsupported-execute-process`
# for a `cmake -E env` in tools/library/CMakeLists.txt. That `tools/` surface is
# disabled in the build-lens convert (CUTLASS_ENABLE_TOOLS=OFF), so the
# configured convert never hits it; the rejection is real for the full tree but
# irrelevant to the header-library build. Without this opt-out the survey's
# skip(rej) gate would short-circuit the build before it runs. The build lens's
# own clean convert is still the real test (it returns skip(convert) if it
# fails), so bypassing the cost-optimization gate here is safe. The reported
# `rejections` column stays 1 (the honest full-tree number).
BUILD_LENS_IGNORE_REJ=1
