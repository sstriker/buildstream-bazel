name: Install cmake toolchain
description: >
  Installs the host-toolchain (cmake + ninja) needed by every CI
  job that runs a kind:cmake render gate or the converter's
  -tags=e2e Go tests. Three sites use this same recipe (the e2e,
  bazel-e2e, and e2e-cmake-matrix jobs); they share this composite
  action so a change to the install sequence — e.g. bumping the
  upstream cmake URL fetch — only has to land once.

  ninja is pre-installed on ubuntu-24.04 runners; this action
  installs the pinned cmake from upstream (the runner's stock
  3.31.6 in /usr/bin is shadowed by /usr/local/bin/<cmake-from-pin>).

inputs:
  cmake_version:
    description: >
      Optional cmake version override. When empty, install-pinned-cmake.sh
      uses the Makefile's CMAKE_VERSION pin (the production target,
      matching what deploy/buildbarn/runner/Dockerfile ships on the
      RBE executor). Set this for the cmake-matrix compatibility
      shakeout job, which iterates over multiple cmake releases
      (3.22 / 3.28 / 4.0 / 4.3) to surface File API / build.ninja
      drift before it hits production. See docs/cmake-version-matrix.md.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install pinned cmake
      shell: bash
      run: |
        # Pin the cmake the orchestrator's defaultPlatform asserts —
        # the runner's stock 3.31.6 in /usr/bin gets shadowed by the
        # /usr/local/bin install. Without the override, converter
        # behavior on cmake 3.31+ only fires in CI, never local dev.
        if [ -n "${{ inputs.cmake_version }}" ]; then
          sudo env PREFIX=/usr/local CMAKE_VERSION="${{ inputs.cmake_version }}" \
            tools/install-pinned-cmake.sh
        else
          sudo env PREFIX=/usr/local tools/install-pinned-cmake.sh
        fi
        cmake --version | head -1
        ninja --version
