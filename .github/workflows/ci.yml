name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  # Manual trigger — operator clicks "Run workflow" in the GitHub
  # UI to invoke a CI run with optional knobs. The fdsdk-probe job
  # reads workflow_dispatch.inputs.fdsdk_ref to pick which FDSDK
  # commit / branch / tag to probe; default master tracks upstream.
  workflow_dispatch:
    inputs:
      fdsdk_ref:
        description: "FDSDK ref to probe (branch / tag / commit). Empty skips the probe."
        required: false
        default: ""
        type: string

# Scope the auto-injected GITHUB_TOKEN. Default permissions on this
# repo are read-only for most resources; the post-failure-tail action
# needs to create PR comments, so explicitly grant `pull-requests:
# write`. `contents: read` is enough for checkout; nothing in this
# workflow writes to the repo content.
permissions:
  contents: read
  pull-requests: write

# Bash with pipefail so `make ... | tee /tmp/cijob.log` propagates make's
# non-zero exit (the post-failure-tail action reads /tmp/cijob.log to
# build its PR comment; without pipefail the tee succeeds and the step
# falsely reports green).
defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Build + unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build converter
        run: make converter 2>&1 | tee -a /tmp/cijob.log

      - name: Vet
        run: make vet 2>&1 | tee -a /tmp/cijob.log

      - name: gofmt
        run: make fmt 2>&1 | tee -a /tmp/cijob.log

      - name: Unit tests
        run: make test 2>&1 | tee -a /tmp/cijob.log

      - uses: ./.github/actions/post-failure-tail
        if: failure()

  e2e:
    name: End-to-end (cmake)
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: ./.github/actions/install-cmake-toolchain

      - name: Build converter
        run: make converter 2>&1 | tee -a /tmp/cijob.log

      - name: hello-world e2e
        run: make e2e-hello-world 2>&1 | tee -a /tmp/cijob.log

      - name: fmt e2e (M2 acceptance)
        run: make e2e-fmt 2>&1 | tee -a /tmp/cijob.log

      - name: cmake-consumer e2e (M5 step 11)
        run: make e2e-cmake-consumer 2>&1 | tee -a /tmp/cijob.log

      - name: toolchain-skip e2e (configure-time win)
        run: make e2e-toolchain-skip 2>&1 | tee -a /tmp/cijob.log

      - name: bst wrapper smoke test
        run: make e2e-meta-bst-wrapper 2>&1 | tee -a /tmp/cijob.log

      - name: Narrowing-undercoverage audit (non-blocking soft gate)
        # Soft launch: `make e2e-audit-narrowing` exits non-zero
        # when the combined drift report is non-empty (real signal),
        # but `continue-on-error: true` keeps the job green while
        # the representative fixture set's expected-drift allowlists
        # stabilize. Flipping continue-on-error to false promotes
        # the gate to blocking — a real one-line change because
        # the script's exit code already differentiates clean vs
        # drift. Recipe + policy: docs/design/narrowing-audit.md.
        continue-on-error: true
        run: make e2e-audit-narrowing 2>&1 | tee -a /tmp/cijob.log

      - name: Install buildifier (for gazelle-roundtrip gate)
        run: |
          go install github.com/bazelbuild/buildtools/buildifier@latest
          # GOBIN defaults to $HOME/go/bin in setup-go; expose it
          # on PATH so the meta-gazelle-roundtrip.sh sub-shell
          # finds buildifier without an absolute-path probe.
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: gazelle-roundtrip e2e (Phase 7c/7d/8b)
        run: make e2e-meta-gazelle-roundtrip 2>&1 | tee -a /tmp/cijob.log

      - name: render-project-a e2e (Stage 4 toolchain plan)
        # Renders the per-(variant, platform) probe-cell matrix
        # BUILD.bazel from a CMakePresets.json fixture. Render-only;
        # no cmake / bazel invoked here.
        run: make e2e-meta-render-project-a 2>&1 | tee -a /tmp/cijob.log

      - name: unify-toolchains e2e (Stage 5 toolchain layout + element-signal fold)
        # Folds per-cell probe.json artifacts into the operator's
        # platforms/ + toolchains/ + cc_toolchain_config.bzl + .bazelrc;
        # also exercises --element-signal (per-element builtin
        # include / link search roots folded into the platform).
        # Render-only.
        run: make e2e-meta-unify-toolchains 2>&1 | tee -a /tmp/cijob.log

      - uses: ./.github/actions/post-failure-tail
        if: failure()

  bazel-e2e:
    name: End-to-end (bazel build downstream)
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: ./.github/actions/install-cmake-toolchain

      - name: Install bazelisk
        run: |
          curl -L --fail -o /tmp/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.20.0/bazelisk-linux-amd64
          sudo install -m 0755 /tmp/bazelisk /usr/local/bin/bazelisk
          # bazelisk acts as bazel; symlink so the `bazel` LookPath in
          # bazelbuild_test.go resolves without extra shell config.
          sudo ln -sf /usr/local/bin/bazelisk /usr/local/bin/bazel
          bazel version | head -3 || true

      - name: Build converter
        run: make converter 2>&1 | tee -a /tmp/cijob.log

      - name: downstream bazel build e2e (cross-element kind:cmake)
        # Re-homed from the orchestrator's TestE2E_BazelBuild onto the
        # write-a + Bazel path: render a cross-element kind:cmake
        # graph, build project A, stage-b into B, bazel-build the
        # consumer there. See docs/design/orchestrator-absorption.md.
        run: make e2e-meta-cross-cmake 2>&1 | tee -a /tmp/cijob.log

      - name: run-vs-run regression e2e
        # cmd/run-manifest snapshots a built project A; orchestrate-diff
        # diffs two runs. Asserts the no-drift invariant + drift
        # detection — the write-a + Bazel replacement for the
        # orchestrator's regression e2e.
        run: make e2e-meta-regression 2>&1 | tee -a /tmp/cijob.log

      - name: fidelity e2e — hello-world (smoke fixture)
        run: make e2e-fidelity 2>&1 | tee -a /tmp/cijob.log

      - name: Fetch fmt (real-world fidelity fixture)
        run: make fetch-fmt 2>&1 | tee -a /tmp/cijob.log

      - name: fidelity e2e — fmt (real-world fixture)
        # fmt fidelity is iterative: each delta surfaced lands in
        # docs/fidelity-known-deltas.md before this gate goes green.
        # Until then, allow the step to fail without aborting the
        # job (continue-on-error) so reviewers see the diff output
        # in the log without losing the rest of the pipeline.
        continue-on-error: true
        run: make e2e-fidelity-fmt 2>&1 | tee -a /tmp/cijob.log

      - uses: ./.github/actions/post-failure-tail
        if: failure()

  buildbarn-e2e:
    name: End-to-end (real Buildbarn cache substrate)
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build converter
        run: make converter 2>&1 | tee -a /tmp/cijob.log

      - name: Build custom bb-runner image (cmake/ninja layered on bb-runner-bare)
        # Building the worker image as an explicit step surfaces
        # Dockerfile / apt-repo issues independently of the test run
        # below. docker compose up would build it implicitly anyway,
        # but the failure mode there is opaque. The remote-execution
        # gate below (e2e-meta-buildbarn-re) needs this image.
        run: docker compose -f deploy/buildbarn/docker-compose.yml build bb-runner-bare 2>&1 | tee -a /tmp/cijob.log

      - name: Run source-push roundtrip against real bb-storage (PR #59)
        # Pack a synthetic source tree, push every blob into CAS via
        # cmd/source-push's wire format, then read it back through
        # casfuse.Tree. Verifies BatchUpdateBlobs / BatchReadBlobs
        # / ByteStream.Read interop with bb-storage end-to-end.
        run: make e2e-source-push 2>&1 | tee -a /tmp/cijob.log

      - name: Run kind:autotools round-2 live-AC roundtrip
        # trace-publish writes an AC entry against real buildbarn;
        # trace-lookup re-derives the synthetic key from the same
        # srckey and asserts the published digest comes back. The
        # bb_clientd mount-half runs only when bb_clientd is on
        # PATH (gate self-skips otherwise). Validates the wire
        # contract round-2's _trace_repo Bazel rule depends on.
        run: make e2e-meta-autotools-round2-live 2>&1 | tee -a /tmp/cijob.log

      - name: Install bazelisk (for the remote-execution gate)
        # The remote-execution gate below IS a `bazel build`; it
        # self-skips if no bazel >= 9 is on PATH, so install it
        # explicitly rather than rely on the runner image.
        run: |
          curl -L --fail -o /tmp/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.20.0/bazelisk-linux-amd64
          sudo install -m 0755 /tmp/bazelisk /usr/local/bin/bazelisk
          sudo ln -sf /usr/local/bin/bazelisk /usr/local/bin/bazel

      - name: Run write-a + Bazel remote-execution + bwotb gate
        # Drives the rendered project A's convert-element-cmake genrule
        # against the real Buildbarn stack via Bazel-native
        # --remote_executor, asserting it executes on a worker and the
        # output stays build-without-the-bytes. The production-path
        # replacement for the orchestrator's Go-harness e2e-buildbarn*
        # coverage — see docs/design/orchestrator-absorption.md.
        #
        # BST_RE_GATE_REQUIRE=1 turns the gate's bazel-availability
        # skip into a hard failure: this step IS the bazel build, so a
        # green job must mean it actually ran, not that it quietly
        # opted out. bazelisk is installed above, so it will run.
        env:
          BST_RE_GATE_REQUIRE: "1"
        run: make e2e-meta-buildbarn-re 2>&1 | tee -a /tmp/cijob.log

      - uses: ./.github/actions/post-failure-tail
        if: failure()

  e2e-cmake-matrix:
    # Multi-version cmake compatibility shakeout. Same surface as the
    # `e2e` job, but runs in parallel against four cmake versions
    # chosen to span the operator floor → cutting-edge spread:
    #
    #   3.22.6 — Ubuntu 22.04 LTS default; the operator floor we
    #            expect downstream BuildStream projects to still
    #            ship against.
    #   3.28.6 — Ubuntu 24.04 LTS default; LLVM 23's floor; the
    #            modern stable reference.
    #   4.0.7  — the major-bump that dropped pre-3.5 compat; most
    #            likely to surface drift in fixtures + File API +
    #            build.ninja consumers.
    #   4.3.3  — latest stable cmake release; catches new-release
    #            bugs (CMP policy removals, build.ninja shape
    #            changes, fileapi schema additions) before they
    #            propagate down to distro defaults.
    #
    # Tripwire for File API schema bumps, build.ninja shape drift,
    # and policy-removal regressions in newer cmakes; non-blocking
    # — `continue-on-error: true` at the job level applies to each
    # matrix instantiation, and `strategy.fail-fast: false` keeps
    # one entry's failure from cancelling the others. A single
    # upstream cmake change can't gate every PR.  Reviewers should
    # still investigate failures — they signal real compatibility
    # gaps the pinned-cmake job can't see. Once the matrix has
    # been green for a release cycle it promotes to a blocking
    # gate; see docs/cmake-version-matrix.md for promotion
    # criteria + per-version known notes.
    #
    # Picking specific releases (rather than relying on the runner's
    # stock cmake, which tracks the apt 3.x line) is what gates the
    # TestConfigure_CMP0026_HintSurfaces e2e — CMP0026 only
    # fatal-errors on cmake >= 4.x; under cmake 3.x the test
    # skips.
    name: End-to-end (cmake ${{ matrix.cmake_version }} — non-blocking)
    runs-on: ubuntu-24.04
    needs: unit
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        cmake_version: ["3.22.6", "3.28.6", "4.0.7", "4.3.3"]
    env:
      # CMAKE_POLICY_VERSION_MINIMUM gives projects with old
      # `cmake_minimum_required(VERSION X)` floors (X < 3.5) a
      # one-version policy bump so cmake 4.x configures them
      # instead of fatal-erroring. All in-tree fixtures already
      # declare ≥ 3.20, but try_compile sub-projects cmake
      # generates internally + future fixtures might not, so set
      # it defensively. Empty on 3.x entries (the variable is
      # only consulted by cmake 3.24+ and only acts on 4.x).
      CMAKE_POLICY_VERSION_MINIMUM: ${{ startsWith(matrix.cmake_version, '4.') && '3.5' || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: ./.github/actions/install-cmake-toolchain
        with:
          cmake_version: ${{ matrix.cmake_version }}

      - name: Build converter
        run: make converter 2>&1 | tee -a /tmp/cijob.log

      - name: hello-world e2e (against cmake ${{ matrix.cmake_version }})
        # The Go-level e2e test calls cmakerun.Configure directly and
        # doesn't go through main.go's AssertVersion gate, so it
        # exercises the loader against whatever cmake the runner has
        # without needing --allow-cmake-version-mismatch.
        run: make e2e-hello-world 2>&1 | tee -a /tmp/cijob.log

      - name: convert-element-cmake binary against cmake ${{ matrix.cmake_version }}
        # Drives the convert-element-cmake CLI explicitly with the
        # version-mismatch escape hatch so the fileapi schema-major
        # check is the actual tripwire on the binary path. If a
        # future cmake bumps codemodel/cache/toolchains/cmakeFiles
        # major, this is where it fires — with a clear "schema major
        # N not supported" error rather than a downstream parse
        # crash.
        run: |
          tmpdir=$(mktemp -d)
          ./build/bin/convert-element-cmake \
            --source-root converter/testdata/sample-projects/hello-world \
            --out-build "$tmpdir/BUILD.bazel" \
            --allow-cmake-version-mismatch \
            --verify \
            2>&1 | tee -a /tmp/cijob.log

      - name: CMP0026 hint e2e (cmake 4.x stderr-scrape)
        # Drives Configure against a CMakeLists.txt that uses the
        # pre-3.0 `get_target_property(... LOCATION)` idiom (the
        # shape yasm and other vintage packages still ship).
        # cmake 4.x fatal-errors at configure; the test asserts
        # the [hint] block + CMP0026 marker + patch_cmds
        # reference all surface in the wrapped error. On cmake
        # 3.x the test self-skips.
        run: |
          go test ./converter/internal/cmakerun/... \
            -run TestConfigure_CMP0026_HintSurfaces -v 2>&1 | tee -a /tmp/cijob.log

      - uses: ./.github/actions/post-failure-tail
        if: failure()

  fdsdk-probe:
    # Empirical FDSDK reality-check probe: clone FDSDK at the
    # requested ref, run scripts/fdsdk-reality-check.sh, upload
    # the per-element status report as an artifact. Triggered
    # only via workflow_dispatch with a non-empty fdsdk_ref input
    # — every push / PR skips it (FDSDK clone is ~150MB and the
    # probe takes minutes; not worth gating every CI run).
    name: FDSDK reality-check probe
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.fdsdk_ref != ''
    needs: unit
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Clone FDSDK at ${{ inputs.fdsdk_ref }}
        run: |
          git clone --depth=1 --branch="${{ inputs.fdsdk_ref }}" \
              https://gitlab.com/freedesktop-sdk/freedesktop-sdk.git \
              /tmp/fdsdk

      - name: Run probe
        run: |
          FDSDK_DIR=/tmp/fdsdk scripts/fdsdk-reality-check.sh 2>&1 \
              | tee /tmp/probe-report.txt

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdsdk-probe-report-${{ github.run_id }}
          path: /tmp/probe-report.txt
          if-no-files-found: warn

      - uses: ./.github/actions/post-failure-tail
        if: failure()
