name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  # Manual trigger — operator clicks "Run workflow" in the GitHub
  # UI to invoke a CI run with optional knobs. The fdsdk-probe job
  # reads workflow_dispatch.inputs.fdsdk_ref to pick which FDSDK
  # commit / branch / tag to probe; default master tracks upstream.
  workflow_dispatch:
    inputs:
      fdsdk_ref:
        description: "FDSDK ref to probe (branch / tag / commit). Empty skips the probe."
        required: false
        default: ""
        type: string

# Scope the auto-injected GITHUB_TOKEN. Default permissions on this
# repo are read-only for most resources; the post-failure-tail action
# needs to create PR comments, so explicitly grant `pull-requests:
# write`. `contents: read` is enough for checkout; nothing in this
# workflow writes to the repo content.
permissions:
  contents: read
  pull-requests: write

# Bash with pipefail so `make ... | tee /tmp/cijob.log` propagates make's
# non-zero exit (the post-failure-tail action reads /tmp/cijob.log to
# build its PR comment; without pipefail the tee succeeds and the step
# falsely reports green).
defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Build + unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build converter
        run: make converter 2>&1 | tee -a /tmp/cijob.log

      - name: Vet
        run: make vet 2>&1 | tee -a /tmp/cijob.log

      - name: gofmt
        run: make fmt 2>&1 | tee -a /tmp/cijob.log

      - name: staticcheck
        run: make staticcheck 2>&1 | tee -a /tmp/cijob.log

      - name: Unit tests
        run: make test 2>&1 | tee -a /tmp/cijob.log

      - uses: ./.github/actions/post-failure-tail
        if: failure()

  e2e:
    name: End-to-end (cmake)
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: ./.github/actions/install-cmake-toolchain

      - name: Build converter
        run: make converter 2>&1 | tee -a /tmp/cijob.log

      - name: hello-world e2e
        run: make e2e-hello-world 2>&1 | tee -a /tmp/cijob.log

      - name: fmt e2e (M2 acceptance)
        run: make e2e-fmt 2>&1 | tee -a /tmp/cijob.log

      - name: cmake-consumer e2e (M5 step 11)
        run: make e2e-cmake-consumer 2>&1 | tee -a /tmp/cijob.log

      - name: toolchain-skip e2e (configure-time win)
        run: make e2e-toolchain-skip 2>&1 | tee -a /tmp/cijob.log

      - name: bst wrapper smoke test
        run: make e2e-meta-bst-wrapper 2>&1 | tee -a /tmp/cijob.log

      - name: Narrowing-undercoverage audit (blocking gate)
        # `make e2e-audit-narrowing` exits non-zero when the combined
        # drift report is non-empty (real signal). Promoted to blocking
        # (was continue-on-error: true) — the representative fixture
        # set's expected-drift allowlists have stabilized (the audit
        # runs clean: 0 drift entries). The audit is deterministic (the
        # cmake oracle vs the read-paths patterns; no network), so a red
        # here is a real narrowing-undercoverage regression, not a
        # flake. Recipe + policy: docs/design/narrowing-audit.md.
        run: make e2e-audit-narrowing 2>&1 | tee -a /tmp/cijob.log

      - name: Install buildifier (for gazelle-roundtrip gate)
        run: |
          go install github.com/bazelbuild/buildtools/buildifier@latest
          # GOBIN defaults to $HOME/go/bin in setup-go; expose it
          # on PATH so the meta-gazelle-roundtrip.sh sub-shell
          # finds buildifier without an absolute-path probe.
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: gazelle-roundtrip e2e (Phase 7c/7d/8b)
        run: make e2e-meta-gazelle-roundtrip 2>&1 | tee -a /tmp/cijob.log

      - name: render-project-a e2e (Stage 4 toolchain plan)
        # Renders the per-(variant, platform) probe-cell matrix
        # BUILD.bazel from a CMakePresets.json fixture. Render-only;
        # no cmake / bazel invoked here.
        run: make e2e-meta-render-project-a 2>&1 | tee -a /tmp/cijob.log

      - name: unify-toolchains e2e (Stage 5 toolchain layout + element-signal fold)
        # Folds per-cell probe.json artifacts into the operator's
        # platforms/ + toolchains/ + cc_toolchain_config.bzl + .bazelrc;
        # also exercises --element-signal (per-element builtin
        # include / link search roots folded into the platform).
        # Render-only.
        run: make e2e-meta-unify-toolchains 2>&1 | tee -a /tmp/cijob.log

      - uses: ./.github/actions/post-failure-tail
        if: failure()

  bazel-e2e:
    name: End-to-end (bazel build downstream)
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: ./.github/actions/install-cmake-toolchain

      - name: Install bazelisk
        run: |
          curl -L --fail -o /tmp/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.20.0/bazelisk-linux-amd64
          sudo install -m 0755 /tmp/bazelisk /usr/local/bin/bazelisk
          # bazelisk acts as bazel; symlink so the `bazel` LookPath in
          # bazelbuild_test.go resolves without extra shell config.
          sudo ln -sf /usr/local/bin/bazelisk /usr/local/bin/bazel
          bazel version | head -3 || true

      - name: Build converter
        run: make converter 2>&1 | tee -a /tmp/cijob.log

      # Persist bazel's repository cache for the go-test fidelity harness
      # (e2e-fidelity / e2e-fidelity-fmt), which drives `bazel build` +
      # `bazel cquery` directly. Same rationale as the `fidelity` job's cache:
      # after the first cold populate the BCR archives (rules_cc / rules_pkg)
      # are reused with no re-download, so the blocking hello-world fidelity
      # gate stops flaking on the transient GitHub-releases 502s that fail the
      # fetch. fidelity_e2e_test.go reads BSB_BAZEL_REPO_CACHE and threads
      # --repository_cache into its bazel invocations.
      - name: Set bazel repo-cache path for fidelity go-test
        run: echo "BSB_BAZEL_REPO_CACHE=$HOME/.cache/bazel-e2e-repo" >> "$GITHUB_ENV"

      - name: Cache bazel repository cache (bazel-e2e)
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-e2e-repo
          key: bazel-e2e-repo-${{ hashFiles('converter/cmd/convert-element-cmake/fidelity_e2e_test.go', 'go.mod') }}
          restore-keys: |
            bazel-e2e-repo-

      - name: meta-project acceptance gate (hello-world round-trip + narrowing)
        # The Phase-1 acceptance gate: render project A + B for the
        # hello-world fixture, bazel-build A, stage into B, link + run
        # the smoke binary, then exercise the read-paths narrowing
        # cache-stability scenarios. Wired in so the gate can't rot
        # unnoticed again — it previously fell behind a removed write-a
        # flag (--read-paths-feedback) because nothing in CI ran it.
        run: make e2e-meta-hello 2>&1 | tee -a /tmp/cijob.log

      - name: downstream bazel build e2e (cross-element kind:cmake)
        # Re-homed from the (now-deleted) orchestrator's
        # TestE2E_BazelBuild onto the write-a + Bazel path: render a
        # cross-element kind:cmake graph, build project A, stage-b
        # into B, bazel-build the consumer there.
        run: make e2e-meta-cross-cmake 2>&1 | tee -a /tmp/cijob.log

      - name: split-packages TreeArtifact e2e (--split-packages)
        # Exercises the cmake_split_convert TreeArtifact rule end-to-end:
        # render a multi-CMakeLists element with write-a --split-packages,
        # bazel-build the per-package TreeArtifact in project A, stage-b
        # it into B, and bazel-build the split tree there (the synthesized
        # header library carries the cross-package include path).
        run: make e2e-meta-cmake-split-build 2>&1 | tee -a /tmp/cijob.log

      - name: split-packages + multi-config e2e (--split-packages --build-types)
        # Composes the split path with multi-config: write-a threads
        # --build-types into the cmake_split_convert action (each per-dir
        # BUILD carries //config:<name> select() arms), renders the //config
        # package + bazel_skylib dep into B, and the staged split tree
        # compiles under --//config:build_type=debug with the selects
        # resolving against //config.
        run: make e2e-meta-cmake-split-multiconfig 2>&1 | tee -a /tmp/cijob.log

      - name: gazelle_cc-owns-layout e2e (--split-packages --gazelle-cc)
        # Phase-8b continuous conversion: render the --split-packages
        # output with --gazelle-cc, run `bazel run //:gazelle` over it,
        # and assert the build still works, the install-export cc_imports
        # survive (the whole-rule # keep fix), and a second gazelle pass
        # is a fixpoint. CI uses gazelle_cc's transitive go_sdk.download
        # (META_GAZELLE_USE_HOST_GO unset).
        run: make e2e-meta-cmake-split-gazelle 2>&1 | tee -a /tmp/cijob.log

      - name: cmake render gates (convert + render-assert + bazel-build halves)
        # The meta-cmake-*.sh render gates: each converts a sample project
        # and asserts the rendered BUILD, and several bazel-build the result
        # (the load-bearing half the Go unit tests + goldens don't cover —
        # genex probe/two-pass, file(GENERATE), FILE_SET strip_include_prefix,
        # and the VCS / volatile stamp lifts under --stamp). Each gate skips
        # cleanly when its toolchain is absent.
        #
        # Soft-launch (non-blocking) per the repo's new-CI-gate policy (same
        # as the fidelity gates): each gate runs its own fresh bazel build
        # that fetches deps from GitHub releases, which intermittently 502 in
        # this environment (the "CI baseline" flakiness in ROADMAP.md). The
        # gates still RUN and report; promote this step to blocking (drop
        # continue-on-error) once the dep-fetch flakiness is addressed, after
        # the usual three-consecutive-green policy.
        continue-on-error: true
        run: make e2e-meta-cmake-render-gates 2>&1 | tee -a /tmp/cijob.log

      - name: run-vs-run regression e2e
        # cmd/run-manifest snapshots a built project A; orchestrate-diff
        # diffs two runs. Asserts the no-drift invariant + drift
        # detection — the write-a + Bazel replacement for the
        # orchestrator's regression e2e.
        run: make e2e-meta-regression 2>&1 | tee -a /tmp/cijob.log

      - name: fidelity e2e — hello-world (smoke fixture)
        run: make e2e-fidelity 2>&1 | tee -a /tmp/cijob.log

      - name: Fetch fmt (real-world fidelity fixture)
        run: make fetch-fmt 2>&1 | tee -a /tmp/cijob.log

      - name: fidelity e2e — fmt (real-world fixture)
        # fmt fidelity is iterative: each delta surfaced lands in
        # docs/known-deltas.md before this gate goes green.
        # Until then, allow the step to fail without aborting the
        # job (continue-on-error) so reviewers see the diff output
        # in the log without losing the rest of the pipeline.
        continue-on-error: true
        run: make e2e-fidelity-fmt 2>&1 | tee -a /tmp/cijob.log

      - uses: ./.github/actions/post-failure-tail
        if: failure()

  fidelity:
    name: A-B-C fidelity (convert + rebuild)
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: ./.github/actions/install-cmake-toolchain

      - name: Install bazelisk
        run: |
          curl -L --fail -o /tmp/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.20.0/bazelisk-linux-amd64
          sudo install -m 0755 /tmp/bazelisk /usr/local/bin/bazelisk
          sudo ln -sf /usr/local/bin/bazelisk /usr/local/bin/bazel
          bazel version | head -3 || true

      - name: Build converter
        run: make converter 2>&1 | tee -a /tmp/cijob.log

      # Persist bazel's repository cache (the BCR archives the fidelity
      # gates fetch: rules_cc / rules_pkg / zlib) across CI runs. run-
      # fidelity.sh points --repository_cache here; after the first cold
      # populate the archives are reused with no re-download, so the now-
      # blocking gates don't flake on transient GitHub-releases 502s. The
      # cache is content-addressed, so a stale restore is always safe (bazel
      # re-verifies hashes); restore-keys seed any prior cache.
      - name: Cache fidelity bazel repository cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-fidelity-repo
          key: bazel-fidelity-repo-${{ hashFiles('scripts/run-fidelity.sh', 'Makefile') }}
          restore-keys: |
            bazel-fidelity-repo-

      # A-B-C fidelity: cmake build → convert-element-cmake → bazel build →
      # cmd/fidelity-compare symbol-diff of the two artifacts. Each gate
      # exits non-zero only on impactful deltas (unexplained symbol drops,
      # hermeticity leaks); benign categories auto-classify, the rest sit
      # in per-project allowlists (testdata/fidelity/*.allowlist.txt).
      #
      # BLOCKING (productionized) — promoted from the soft-launch
      # continue-on-error after the soft-launch period: all fixtures run
      # green (0 impactful deltas) across merges, so a red here is now a
      # real fidelity regression (an unexplained symbol drop / hermeticity
      # leak), not a tracker signal. One step per fixture so a failure names
      # the offending project. The bazel half fetches BCR deps (rules_cc /
      # rules_pkg, + zlib for libpng); the persistent --repository_cache
      # (cached above) means those archives fetch once and are reused across
      # runs, so a transient GitHub-releases 502 only risks the first cold
      # populate — which run-fidelity.sh also rides out with a raised
      # --experimental_repository_downloader_retries.
      - name: fidelity — zlib (library)
        run: make e2e-fidelity-compare-zlib 2>&1 | tee -a /tmp/cijob.log

      - name: fidelity — zlib (consumer)
        run: make e2e-fidelity-compare-zlib-consumer 2>&1 | tee -a /tmp/cijob.log

      - name: fidelity — fmt (library)
        run: make e2e-fidelity-compare-fmt 2>&1 | tee -a /tmp/cijob.log

      - name: fidelity — fmt (consumer)
        run: make e2e-fidelity-compare-fmt-consumer 2>&1 | tee -a /tmp/cijob.log

      - name: fidelity — spdlog (library)
        run: make e2e-fidelity-compare-spdlog 2>&1 | tee -a /tmp/cijob.log

      - name: fidelity — spdlog (consumer)
        # spdlog is a compiled library (PUBLIC SPDLOG_COMPILED_LIB), so the
        # consumer compiles in compiled-lib mode against the converted target.
        # run-fidelity.sh replays the define on the cmake side
        # (--consumer-cmake-cflags) and matches the -O2 opt level on both
        # sides so the .o symbol sets are comparable. 63/63 exported match,
        # 0 impactful deltas.
        run: make e2e-fidelity-compare-spdlog-consumer 2>&1 | tee -a /tmp/cijob.log

      - name: fidelity — nlohmann-json (consumer)
        # Header-only INTERFACE library: no static archive to diff, so
        # this is consumer-side only. Unblocked now that the converter
        # lowers the INTERFACE_LIBRARY target to a cc_library(hdrs=...,
        # includes=...) a consumer can depend on (the
        # cmake-codegen-interface-library-from-trace synthesis).
        run: make e2e-fidelity-compare-nlohmann-json-consumer 2>&1 | tee -a /tmp/cijob.log

      - name: fidelity — Catch2 (library)
        # Configure_file lift: the lib #includes the generated
        # catch2/catch_user_config.hpp. run-fidelity.sh threads
        # --lift-configure-file and auto-stages //tools:cmake-configure-file;
        # the converter wires the genrule's generated-includes/ dir into
        # the cc_library's includes. Large template-heavy lib — the
        # classifier auto-classifies std:: instantiation variance, a small
        # allowlist covers Catch's own template dtors.
        run: make e2e-fidelity-compare-catch2 2>&1 | tee -a /tmp/cijob.log

      - name: Install zlib 1.3.1 (match the BCR @zlib pin for the libpng gate)
        # libpng bakes PNG_ZLIB_VERNUM into pnglibconf.h from whatever zlib
        # cmake's find_package(ZLIB) resolves at configure time, then asserts
        # ZLIB_VERNUM == PNG_ZLIB_VERNUM at compile. ubuntu-24.04 ships zlib
        # 1.3 (0x12a0), but the Bazel build compiles libpng against the pinned
        # BCR @zlib 1.3.1.bcr.5 (0x12b1) — so the host vs. BCR skew trips the
        # assert. Build & install upstream zlib 1.3.1 to /usr/local (searched
        # ahead of /usr by find_package), so the cmake reference resolves the
        # same 1.3.1 the Bazel side links and the two versions agree.
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSL -o zlib-1.3.1.tar.gz \
            https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar xzf zlib-1.3.1.tar.gz
          cd zlib-1.3.1
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig

      - name: fidelity — libpng (library)
        # The deferred-blocker fixture, now wired: install-compat symlinks
        # skip (PR #350), cmake -P script headers bake (--cmake-script-bake),
        # find_package(ZLIB) → @zlib via --imports-manifest, and
        # --bazel-external adds the zlib BCR module. The cmake-side
        # find_package(ZLIB) resolves the zlib 1.3.1 installed above so its
        # baked PNG_ZLIB_VERNUM matches the BCR @zlib the Bazel side compiles
        # against (see the install step's note).
        run: make e2e-fidelity-compare-libpng 2>&1 | tee -a /tmp/cijob.log

      - uses: ./.github/actions/post-failure-tail
        if: failure()

  buildbarn-e2e:
    name: End-to-end (real Buildbarn cache substrate)
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build converter
        run: make converter 2>&1 | tee -a /tmp/cijob.log

      - name: Build custom bb-runner image (cmake/ninja layered on bb-runner-bare)
        # Building the worker image as an explicit step surfaces
        # Dockerfile / apt-repo issues independently of the test run
        # below. docker compose up would build it implicitly anyway,
        # but the failure mode there is opaque. The remote-execution
        # gate below (e2e-meta-buildbarn-re) needs this image.
        #
        # Retry the build: resolving the base images (docker.io
        # debian:bookworm-slim, ghcr.io bb-runner-bare) transiently times out
        # — the recurring buildbarn-e2e flake. Re-attempts reuse cached layers,
        # so a retry is cheap and clears the transient registry stall.
        run: |
          # Explicit pipefail: the retry below keys off the `docker compose
          # build` exit, but it's piped to tee — without pipefail the pipeline
          # would report tee's success and never retry. (The job's shell: bash
          # default already enables it; set it here too so the retry is robust
          # regardless of how this step is invoked.)
          set -o pipefail
          n=0
          until [ "$n" -ge 3 ]; do
            if docker compose -f deploy/buildbarn/docker-compose.yml build bb-runner-bare 2>&1 | tee -a /tmp/cijob.log; then
              exit 0
            fi
            n=$((n + 1))
            # Only back off + announce a retry when another attempt will run.
            if [ "$n" -lt 3 ]; then
              echo "bb-runner image build attempt $n failed (likely a transient registry timeout); retrying in $((n * 10))s" | tee -a /tmp/cijob.log
              sleep $((n * 10))
            fi
          done
          echo "bb-runner image build failed after 3 attempts" | tee -a /tmp/cijob.log
          exit 1

      - name: Run source-push roundtrip against real bb-storage (PR #59)
        # Pack a synthetic source tree, push every blob into CAS via
        # cmd/source-push's wire format, then read it back through
        # casfuse.Tree. Verifies BatchUpdateBlobs / BatchReadBlobs
        # / ByteStream.Read interop with bb-storage end-to-end.
        run: make e2e-source-push 2>&1 | tee -a /tmp/cijob.log

      - name: Run kind:autotools round-2 live-AC roundtrip
        # trace-publish writes an AC entry against real buildbarn;
        # trace-lookup re-derives the synthetic key from the same
        # srckey and asserts the published digest comes back. The
        # bb_clientd mount-half runs only when bb_clientd is on
        # PATH (gate self-skips otherwise). Validates the wire
        # contract round-2's _trace_repo Bazel rule depends on.
        run: make e2e-meta-autotools-round2-live 2>&1 | tee -a /tmp/cijob.log

      - name: Install bazelisk (for the remote-execution gate)
        # The remote-execution gate below IS a `bazel build`; it
        # self-skips if no bazel >= 9 is on PATH, so install it
        # explicitly rather than rely on the runner image.
        run: |
          curl -L --fail -o /tmp/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.20.0/bazelisk-linux-amd64
          sudo install -m 0755 /tmp/bazelisk /usr/local/bin/bazelisk
          sudo ln -sf /usr/local/bin/bazelisk /usr/local/bin/bazel

      - name: Run write-a + Bazel remote-execution + bwotb gate
        # Drives the rendered project A's convert-element-cmake genrule
        # against the real Buildbarn stack via Bazel-native
        # --remote_executor, asserting it executes on a worker and the
        # output stays build-without-the-bytes. The production-path
        # replacement for the (now-deleted) orchestrator's Go-harness
        # e2e-buildbarn* coverage.
        #
        # BST_RE_GATE_REQUIRE=1 turns the gate's bazel-availability
        # skip into a hard failure: this step IS the bazel build, so a
        # green job must mean it actually ran, not that it quietly
        # opted out. bazelisk is installed above, so it will run.
        env:
          BST_RE_GATE_REQUIRE: "1"
        run: make e2e-meta-buildbarn-re 2>&1 | tee -a /tmp/cijob.log

      - uses: ./.github/actions/post-failure-tail
        if: failure()

  e2e-cmake-matrix:
    # Multi-version cmake compatibility shakeout. Same surface as the
    # `e2e` job, but runs in parallel against four cmake versions
    # chosen to span the operator floor → cutting-edge spread:
    #
    #   3.22.6 — Ubuntu 22.04 LTS default; the operator floor we
    #            expect downstream BuildStream projects to still
    #            ship against.
    #   3.28.6 — Ubuntu 24.04 LTS default; LLVM 23's floor; the
    #            modern stable reference.
    #   4.0.7  — the major-bump that dropped pre-3.5 compat; most
    #            likely to surface drift in fixtures + File API +
    #            build.ninja consumers.
    #   4.3.3  — latest stable cmake release; catches new-release
    #            bugs (CMP policy removals, build.ninja shape
    #            changes, fileapi schema additions) before they
    #            propagate down to distro defaults.
    #
    # Tripwire for File API schema bumps, build.ninja shape drift,
    # and policy-removal regressions in newer cmakes. **Blocking** —
    # promoted from the non-blocking shakeout once all four entries
    # ran green across three consecutive merges (#342 / #343 / #344)
    # with the per-version known-notes resolved in-tree (4.3.3's
    # find-v1 decode bug fixed in PR #244). `strategy.fail-fast:
    # false` stays so one entry's failure doesn't cancel the others'
    # diagnostics — but a red entry now fails the workflow. See
    # docs/cmake-version-matrix.md for the criteria + per-version
    # known notes. (Revert to `continue-on-error: true` if an
    # upstream-cmake change makes an entry flaky for infra reasons.)
    #
    # Picking specific releases (rather than relying on the runner's
    # stock cmake, which tracks the apt 3.x line) is what gates the
    # TestConfigure_CMP0026_HintSurfaces e2e — CMP0026 only
    # fatal-errors on cmake >= 4.x; under cmake 3.x the test
    # skips.
    name: End-to-end (cmake ${{ matrix.cmake_version }})
    runs-on: ubuntu-24.04
    needs: unit
    # Promoted to blocking (was continue-on-error: true) — see the job
    # comment above + docs/cmake-version-matrix.md. fail-fast stays off
    # so all four entries' results surface on a red.
    strategy:
      fail-fast: false
      matrix:
        cmake_version: ["3.22.6", "3.28.6", "4.0.7", "4.3.3"]
    env:
      # CMAKE_POLICY_VERSION_MINIMUM gives projects with old
      # `cmake_minimum_required(VERSION X)` floors (X < 3.5) a
      # one-version policy bump so cmake 4.x configures them
      # instead of fatal-erroring. All in-tree fixtures already
      # declare ≥ 3.20, but try_compile sub-projects cmake
      # generates internally + future fixtures might not, so set
      # it defensively. Empty on 3.x entries (the variable is
      # only consulted by cmake 3.24+ and only acts on 4.x).
      CMAKE_POLICY_VERSION_MINIMUM: ${{ startsWith(matrix.cmake_version, '4.') && '3.5' || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: ./.github/actions/install-cmake-toolchain
        with:
          cmake_version: ${{ matrix.cmake_version }}

      - name: Build converter
        run: make converter 2>&1 | tee -a /tmp/cijob.log

      - name: hello-world e2e (against cmake ${{ matrix.cmake_version }})
        # The Go-level e2e test calls cmakerun.Configure directly and
        # doesn't go through main.go's AssertVersion gate, so it
        # exercises the loader against whatever cmake the runner has
        # without needing --allow-cmake-version-mismatch.
        run: make e2e-hello-world 2>&1 | tee -a /tmp/cijob.log

      - name: convert-element-cmake binary against cmake ${{ matrix.cmake_version }}
        # Drives the convert-element-cmake CLI explicitly with the
        # version-mismatch escape hatch so the fileapi schema-major
        # check is the actual tripwire on the binary path. If a
        # future cmake bumps codemodel/cache/toolchains/cmakeFiles
        # major, this is where it fires — with a clear "schema major
        # N not supported" error rather than a downstream parse
        # crash.
        run: |
          tmpdir=$(mktemp -d)
          ./build/bin/convert-element-cmake \
            --source-root converter/testdata/sample-projects/hello-world \
            --out-build "$tmpdir/BUILD.bazel" \
            --allow-cmake-version-mismatch \
            --verify \
            2>&1 | tee -a /tmp/cijob.log

      - name: CMP0026 hint e2e (cmake 4.x stderr-scrape)
        # Drives Configure against a CMakeLists.txt that uses the
        # pre-3.0 `get_target_property(... LOCATION)` idiom (the
        # shape yasm and other vintage packages still ship).
        # cmake 4.x fatal-errors at configure; the test asserts
        # the [hint] block + CMP0026 marker + patch_cmds
        # reference all surface in the wrapped error. On cmake
        # 3.x the test self-skips.
        run: |
          go test ./converter/internal/cmakerun/... \
            -run TestConfigure_CMP0026_HintSurfaces -v 2>&1 | tee -a /tmp/cijob.log

      - uses: ./.github/actions/post-failure-tail
        if: failure()

  fdsdk-probe:
    # Empirical FDSDK reality-check probe: clone FDSDK at the
    # requested ref, run scripts/fdsdk-reality-check.sh, upload
    # the per-element status report as an artifact. Triggered
    # only via workflow_dispatch with a non-empty fdsdk_ref input
    # — every push / PR skips it (FDSDK clone is ~150MB and the
    # probe takes minutes; not worth gating every CI run).
    name: FDSDK reality-check probe
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.fdsdk_ref != ''
    needs: unit
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Clone FDSDK at ${{ inputs.fdsdk_ref }}
        run: |
          git clone --depth=1 --branch="${{ inputs.fdsdk_ref }}" \
              https://gitlab.com/freedesktop-sdk/freedesktop-sdk.git \
              /tmp/fdsdk

      - name: Run probe
        run: |
          FDSDK_DIR=/tmp/fdsdk scripts/fdsdk-reality-check.sh 2>&1 \
              | tee /tmp/probe-report.txt

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdsdk-probe-report-${{ github.run_id }}
          path: /tmp/probe-report.txt
          if-no-files-found: warn

      - uses: ./.github/actions/post-failure-tail
        if: failure()
