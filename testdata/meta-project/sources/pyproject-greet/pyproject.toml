[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyproject-greet"
version = "0.1.0"
description = "Tiny setuptools fixture for the kind:pyproject native-render gate."

[project.scripts]
greet = "greet.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
